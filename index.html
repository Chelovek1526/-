<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Spotify Clone</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#121212;--panel:#181818;--panel-h:#282828;--accent:#1db954;--accent-h:#1ed760;--text:#fff;--muted:#b3b3b3;--border:#2a2a2a}
html,body{height:100%}
body{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:#4d4d4d;border-radius:5px}
.app{display:grid;grid-template-columns:250px 1fr;grid-template-rows:1fr 92px;height:100vh;height:100dvh}
.sidebar{grid-row:1;grid-column:1;background:#000;padding:20px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font-size:20px;font-weight:700}
.logo .dot{width:26px;height:26px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#000;font-size:15px}
.nav-item{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:6px;color:var(--muted);font-weight:600;font-size:14px;transition:.15s;width:100%;text-align:left}
.nav-item:hover{color:#fff;background:#1a1a1a}
.nav-item.active{color:#fff;background:#1f1f1f}
.nav-item svg{flex-shrink:0}
.side-title{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:1.2px;padding:18px 12px 8px;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between}
.side-title button{color:var(--muted);font-size:20px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;line-height:1;transition:.15s}
.side-title button:hover{color:#fff;background:#2a2a2a}
.side-album{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;font-size:13px;color:var(--muted);transition:.15s;width:100%;text-align:left}
.side-album:hover{background:#1a1a1a;color:#fff}
.side-album .mini-cover{width:34px;height:34px;border-radius:4px;flex-shrink:0;display:grid;place-items:center;font-size:11px;font-weight:700;overflow:hidden}
.side-album .mini-cover img{width:100%;height:100%;object-fit:cover}
.side-album .mini-cover.pl{border-radius:50%}
.main{grid-row:1;grid-column:2;overflow-y:auto;position:relative;background:linear-gradient(180deg,#1c1c1c 0%,#121212 320px);-webkit-overflow-scrolling:touch}
.page{padding:28px 32px 60px}
h1{font-size:32px;margin-bottom:22px;letter-spacing:-.5px}
h2{font-size:21px;margin:28px 0 16px;letter-spacing:-.3px}
.muted{color:var(--muted);font-size:13px}
.empty{padding:50px 20px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:10px;font-size:14px;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:18px}
.card-item{background:var(--panel);border-radius:8px;padding:14px;cursor:pointer;transition:background .2s;position:relative}
.card-item:hover{background:var(--panel-h)}
.card-cover{aspect-ratio:1;border-radius:6px;margin-bottom:12px;overflow:hidden;display:grid;place-items:center;font-size:34px;font-weight:800;color:rgba(255,255,255,.85);position:relative;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.card-cover.pl{border-radius:50%}
.card-cover img{width:100%;height:100%;object-fit:cover}
.card-play{position:absolute;right:10px;bottom:10px;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#000;display:grid;place-items:center;opacity:0;transform:translateY(8px);transition:.2s;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.card-item:hover .card-play{opacity:1;transform:none}
.card-title{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-sub{color:var(--muted);font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-list{display:flex;flex-direction:column}
.track-row{display:grid;grid-template-columns:32px 42px 1fr 130px 42px 52px 34px;align-items:center;gap:14px;padding:8px 12px;border-radius:6px;cursor:pointer;transition:background .12s}
.track-row:hover{background:#232323}
.track-row.playing .tr-title{color:var(--accent)}
.tr-index{color:var(--muted);font-size:14px;text-align:center;position:relative}
.tr-index .play{display:none}
.track-row:hover .tr-index .num{display:none}
.track-row:hover .tr-index .play{display:block}
.tr-cover{width:42px;height:42px;border-radius:4px;overflow:hidden;display:grid;place-items:center;font-size:14px;font-weight:700}
.tr-cover img{width:100%;height:100%;object-fit:cover}
.tr-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-artist{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-album{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-lyrics{font-size:10px;font-weight:700;color:var(--accent);letter-spacing:.5px;text-align:center}
.tr-dur{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.tr-menu{font-size:18px;color:var(--muted);width:30px;height:30px;border-radius:50%;opacity:0;transition:.15s}
.track-row:hover .tr-menu{opacity:1}
.tr-menu:hover{background:#3a3a3a;color:#fff}
.album-header{display:flex;gap:26px;align-items:flex-end;padding:22px 0 30px}
.album-header .big-cover{width:200px;height:200px;border-radius:8px;flex-shrink:0;display:grid;place-items:center;font-size:62px;font-weight:800;color:rgba(255,255,255,.9);box-shadow:0 12px 40px rgba(0,0,0,.6);overflow:hidden}
.album-header .big-cover.pl{border-radius:50%}
.album-header .big-cover img{width:100%;height:100%;object-fit:cover}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.album-header h1{font-size:48px;margin:0 0 14px;line-height:1.05}
.album-header .pl-desc{font-size:13px;color:var(--muted);margin-bottom:6px;max-width:600px}
.btn{padding:10px 22px;border-radius:500px;font-weight:700;font-size:14px;transition:.15s;display:inline-flex;align-items:center;gap:8px}
.btn.accent{background:var(--accent);color:#000}
.btn.accent:hover{background:var(--accent-h);transform:scale(1.03)}
.btn.accent:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{border:1px solid #666;color:#fff}
.btn.ghost:hover{border-color:#fff}
.btn.small{padding:7px 14px;font-size:13px}
.card-box{background:var(--panel);border-radius:12px;padding:22px;max-width:820px}
.field-row{display:flex;gap:14px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.field-row label{font-size:13px;color:var(--muted);font-weight:600;min-width:70px}
input[type=text],input[type=search],input[type=number],select,textarea{background:#2a2a2a;border:1px solid #3a3a3a;color:#fff;border-radius:6px;padding:10px 12px;font-size:14px;outline:none;transition:.15s}
input[type=text]:focus,select:focus,textarea:focus,input[type=number]:focus{border-color:var(--accent);background:#333}
select{cursor:pointer}
textarea{width:100%;min-height:110px;resize:vertical;line-height:1.5;font-size:13px}
.form-block{display:none;gap:10px;flex-direction:column;margin-bottom:16px;padding:16px;background:#202020;border-radius:8px}
.form-block.show{display:flex}
.form-block input[type=text],.form-block input[type=number]{width:100%}
.file-label{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:#2a2a2a;padding:9px 14px;border-radius:6px;cursor:pointer;border:1px solid #3a3a3a}
.file-label:hover{border-color:var(--accent);color:#fff}
.dropzone{border:2px dashed #3d3d3d;border-radius:12px;padding:46px 20px;text-align:center;cursor:pointer;transition:.2s;margin-bottom:18px}
.dropzone:hover,.dropzone.drag{border-color:var(--accent);background:rgba(29,185,84,.06)}
.dropzone .dz-title{font-size:16px;font-weight:600;margin-bottom:6px}
.pending-item{background:#202020;border-radius:8px;padding:14px;margin-bottom:10px;border:1px solid #2e2e2e}
.pi-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.pi-name{font-size:13px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi-remove{color:var(--muted);font-size:16px;width:28px;height:28px;border-radius:50%}
.pi-remove:hover{background:#3a3a3a;color:#fff}
.pi-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.pi-fields input{width:100%}
details summary{cursor:pointer;font-size:12px;color:var(--muted);font-weight:600;padding:6px 0;user-select:none}
details summary:hover{color:#fff}
details[open] summary{color:var(--accent)}
.player{grid-row:2;grid-column:1/-1;background:#000;border-top:1px solid #1a1a1a;display:flex;align-items:center;padding:0 18px;gap:18px}
.p-left{display:flex;align-items:center;gap:12px;width:30%;min-width:190px}
.p-cover{width:56px;height:56px;border-radius:6px;flex-shrink:0;display:grid;place-items:center;font-size:17px;font-weight:800;overflow:hidden;background:#222}
.p-cover img{width:100%;height:100%;object-fit:cover}
.p-info{min-width:0}
.p-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-artist{font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-center{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:640px;margin:0 auto}
.p-controls{display:flex;align-items:center;gap:16px}
.icon-btn{color:var(--muted);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;transition:.15s}
.icon-btn:hover{color:#fff}
.icon-btn.on{color:var(--accent)}
.play-btn{width:40px;height:40px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;transition:.15s}
.play-btn:hover{transform:scale(1.07)}
.p-progress{display:flex;align-items:center;gap:10px;width:100%}
.p-progress span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:34px;text-align:center}
.bar{flex:1;height:4px;background:#4d4d4d;border-radius:2px;cursor:pointer;position:relative}
.bar:hover{height:6px}
.bar-fill{height:100%;background:#fff;border-radius:2px;width:0%}
.bar:hover .bar-fill{background:var(--accent)}
.p-right{display:flex;align-items:center;gap:10px;width:30%;min-width:160px;justify-content:flex-end}
input[type=range]{-webkit-appearance:none;appearance:none;width:90px;height:4px;border-radius:2px;background:#4d4d4d;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;cursor:pointer}
.radio-badge{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--accent);color:#000;font-weight:700;letter-spacing:.5px;margin-left:6px}

/* Side panels */
.side-panel{position:fixed;top:0;right:0;bottom:92px;width:360px;background:#0b0b0b;border-left:1px solid #222;z-index:60;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.side-panel.open{transform:none}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:20px;border-bottom:1px solid #1e1e1e;gap:10px}
.panel-head h3{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-body{padding:14px 14px;overflow-y:auto;flex:1}
.lyrics-body{padding:22px 20px;overflow-y:auto;flex:1;white-space:pre-wrap;font-size:14px;line-height:1.85;color:#d0d0d0}
.lyrics-body.empty-text{color:#666;font-style:italic;white-space:normal;text-align:center;padding-top:60px}
.lyric-line{padding:8px 12px;border-radius:4px;transition:.2s;cursor:pointer;line-height:1.6}
.lyric-line:hover{background:#1e1e1e}
.lyric-line.active{color:var(--accent);font-weight:700;font-size:16px;background:rgba(29,185,84,.08)}

/* Queue */
.queue-section-label{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding:14px 4px 8px}
.queue-item{display:grid;grid-template-columns:24px 40px 1fr 28px;align-items:center;gap:10px;padding:8px 8px;border-radius:6px;margin-bottom:4px;background:#141414;transition:background .15s}
.queue-item:hover{background:#1e1e1e}
.queue-item.current{background:rgba(29,185,84,.12);cursor:default}
.queue-item.current .queue-title{color:var(--accent);font-weight:600}
.queue-item.dragging{opacity:.9;box-shadow:0 8px 24px rgba(0,0,0,.7);background:#2a2a2a;cursor:grabbing}
.queue-drag-handle{color:var(--muted);cursor:grab;font-size:16px;text-align:center;touch-action:none;user-select:none;padding:4px 0}
.queue-drag-handle:active{cursor:grabbing}
.queue-cover{width:40px;height:40px;border-radius:4px;overflow:hidden;display:grid;place-items:center;font-size:13px;font-weight:700}
.queue-cover img{width:100%;height:100%;object-fit:cover}
.queue-info{min-width:0;cursor:pointer}
.queue-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue-artist{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue-remove{color:var(--muted);width:26px;height:26px;border-radius:50%;font-size:14px}
.queue-remove:hover{background:#3a3a3a;color:#fff}
.queue-empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 10px}

/* Modal / ctx */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#1e1e1e;border-radius:12px;padding:24px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.8);max-height:85vh;display:flex;flex-direction:column}
.modal h3{margin-bottom:16px;font-size:18px;flex-shrink:0}
.modal>#modalBody{overflow-y:auto;flex:1;min-height:0}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-shrink:0}
.modal-list{display:flex;flex-direction:column;gap:4px}
.modal-list-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;text-align:left;width:100%;transition:.15s}
.modal-list-item:hover:not(:disabled){background:#2a2a2a}
.modal-list-item:disabled{opacity:.5;cursor:not-allowed}
.mli-cover{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:14px;font-weight:700;overflow:hidden}
.mli-cover img{width:100%;height:100%;object-fit:cover}
.mli-info{min-width:0;flex:1}
.mli-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mli-sub{font-size:12px;color:var(--muted);margin-top:2px}
.ctx-menu{position:fixed;background:#282828;border-radius:6px;padding:6px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.7);min-width:210px}
.ctx-menu button{display:block;width:100%;text-align:left;padding:10px 14px;font-size:13px;border-radius:4px;color:#e0e0e0}
.ctx-menu button:hover{background:#3e3e3e;color:#fff}
.ctx-menu button.danger:hover{background:#5a1f1f;color:#ff8a8a}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent);color:#000;padding:12px 24px;border-radius:6px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:300;text-align:center;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.mobile-header{display:none}
.sidebar-overlay{display:none}
.zip-import-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;background:#2a2a2a;border:1px solid #3a3a3a;border-radius:8px;font-size:13px;font-weight:600;color:#fff;margin-bottom:16px;transition:.15s}
.zip-import-btn:hover{border-color:var(--accent);background:#333}
.import-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:400;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;color:#fff;font-size:16px;text-align:center;padding:20px}
.import-overlay .spinner{width:48px;height:48px;border:4px solid #333;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Mobile */
@media (max-width:768px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;height:100vh;height:100dvh}
  .mobile-header{display:flex;grid-row:1;grid-column:1;align-items:center;justify-content:space-between;padding:10px 14px;background:#000;border-bottom:1px solid #1a1a1a;z-index:50}
  .mobile-logo{font-size:17px;font-weight:700;display:flex;align-items:center}
  .mobile-logo .mini-dot{display:inline-grid;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#000;place-items:center;font-size:13px;margin-right:8px}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:280px;max-width:82vw;z-index:90;transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1);box-shadow:4px 0 24px rgba(0,0,0,.7);grid-row:auto;grid-column:auto;padding-top:18px}
  .sidebar.open{transform:none}
  .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:85;display:none}
  .sidebar-overlay.show{display:block}
  .main{grid-row:2;grid-column:1;background:linear-gradient(180deg,#1c1c1c 0%,#121212 220px)}
  .player{grid-row:3;grid-column:1;display:grid;grid-template-columns:44px minmax(0,1fr) auto auto auto;grid-template-areas:"cover info controls queue lyrics" "progress progress progress progress progress";gap:6px 6px;padding:8px 10px 10px;height:auto;align-items:center}
  .p-left,.p-center{display:contents}
  .p-cover{grid-area:cover;width:44px;height:44px;font-size:13px}
  .p-cover img{border-radius:4px}
  .p-info{grid-area:info;min-width:0}
  .p-title{font-size:13px}
  .p-artist{font-size:11px;margin-top:2px}
  .p-controls{grid-area:controls;gap:0}
  .p-controls>#shuffleBtn,.p-controls>#repeatBtn{display:none}
  .p-right{grid-area:lyrics;width:auto;min-width:0;gap:0;justify-content:flex-end}
  .p-right>svg,.p-right>input[type=range]{display:none}
  .p-progress{grid-area:progress;gap:6px;width:100%}
  .p-progress span{font-size:10px;min-width:26px}
  .icon-btn{width:30px;height:30px}
  .play-btn{width:38px;height:38px}
  #queueBtn{grid-area:queue}
  .page{padding:16px 14px 40px}
  h1{font-size:24px;margin-bottom:16px}
  h2{font-size:18px;margin:22px 0 12px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:12px}
  .card-item{padding:10px}
  .card-title{font-size:13px}
  .card-sub{font-size:11px}
  .track-row{grid-template-columns:22px 40px 1fr 40px 26px;gap:8px;padding:6px 8px}
  .tr-album,.tr-lyrics{display:none}
  .tr-menu{opacity:1}
  .tr-cover{width:40px;height:40px}
  .tr-title{font-size:13px}
  .tr-artist{font-size:11px}
  .tr-dur{font-size:12px}
  .album-header{flex-direction:column;align-items:center;text-align:center;gap:14px;padding:14px 0 22px}
  .album-header .big-cover{width:160px;height:160px;font-size:52px}
  .album-header h1{font-size:26px}
  .card-box{padding:16px}
  .field-row{flex-direction:column;align-items:stretch}
  .field-row label{min-width:0}
  .pi-fields{grid-template-columns:1fr}
  .dropzone{padding:30px 16px}
  input[type=text],input[type=search],input[type=number],select,textarea{font-size:16px}
  .side-panel{top:0;bottom:0;width:100%;border-left:none;z-index:120}
  .modal{max-width:none;margin:10px;padding:18px}
  .toast{bottom:130px;font-size:13px;padding:10px 18px}
}
@media (min-width:769px){
  #queueBtn{display:grid}
}

/* Full player */
.full-player{position:fixed;inset:0;z-index:95;background:linear-gradient(180deg,#2a2a2a 0%,#121212 60%);display:flex;flex-direction:column;padding:12px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow:hidden}
.full-player.open{transform:none}
.fp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-shrink:0}
.fp-header-title{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.fp-cover{width:min(320px,45vh);aspect-ratio:1;margin:0 auto 20px;border-radius:10px;overflow:hidden;display:grid;place-items:center;font-size:60px;font-weight:800;color:rgba(255,255,255,.9);box-shadow:0 12px 40px rgba(0,0,0,.6);flex-shrink:0}
.fp-cover img{width:100%;height:100%;object-fit:cover}
.fp-info{margin-bottom:18px;flex-shrink:0}
.fp-title{font-size:22px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp-artist{font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp-progress{margin-bottom:6px;flex-shrink:0}
.fp-times{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.fp-controls{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px;padding:0 4px;flex-shrink:0}
.fp-ctrl{width:44px;height:44px;color:var(--muted)}
.fp-ctrl.on{color:var(--accent)}
.fp-play{width:64px;height:64px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;transition:.15s}
.fp-bottom{display:flex;gap:12px;margin-top:auto;padding-top:14px;flex-shrink:0}
.fp-bottom-btn{flex:1;padding:12px;border-radius:8px;background:#1e1e1e;color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.fp-bottom-btn.on{color:var(--accent)}
.fp-timer-menu{position:absolute;bottom:90px;right:20px;left:20px;background:#282828;border-radius:10px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.7);display:none;flex-direction:column;max-height:60vh;overflow-y:auto;z-index:5}
.fp-timer-menu.show{display:flex}
.fp-timer-menu button{padding:12px 16px;text-align:left;font-size:14px;border-radius:6px;color:#e0e0e0}
@media (min-width:769px){.full-player{display:none!important}}

/* Tap-to-sync */
.tap-sync-overlay{position:fixed;inset:0;z-index:150;background:#121212;display:flex;flex-direction:column;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.ts-header{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-shrink:0}
.ts-title{font-size:15px;font-weight:700;flex:1}
.ts-progress{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ts-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding:6px 0}
.ts-line{display:flex;gap:12px;padding:10px 12px;border-radius:6px;cursor:pointer;transition:.15s;align-items:flex-start}
.ts-line.active{background:rgba(29,185,84,.12);border-left:3px solid var(--accent)}
.ts-line.active .ts-text{color:var(--accent);font-weight:600}
.ts-line.done .ts-time{color:var(--accent)}
.ts-time{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:58px;padding-top:2px}
.ts-text{font-size:14px;line-height:1.4}
.ts-footer{flex-shrink:0;padding-top:10px}
.ts-bar{height:4px;background:#3a3a3a;border-radius:2px;overflow:hidden}
.ts-fill{height:100%;background:var(--accent);width:0%;transition:width .1s linear}
.ts-time-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:4px 0 10px}
.ts-actions{display:flex;gap:8px}
.ts-actions .btn{flex:1;justify-content:center}
</style>
</head>

<script>
/* Utils */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(sec){ if(!isFinite(sec)||sec<0)sec=0; const m=Math.floor(sec/60),s=Math.floor(sec%60); return m+':'+String(s).padStart(2,'0'); }
function fmtLRC(t){ if(!isFinite(t)||t<0)t=0; const m=Math.floor(t/60),s=Math.floor(t%60),cs=Math.floor((t%1)*100); return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`; }
function hashHue(str){let h=0;for(const ch of String(str))h=(h*31+ch.charCodeAt(0))%360;return h}
function coverStyle(name){const h=hashHue(name||'x');return `background:linear-gradient(135deg,hsl(${h} 68% 42%),hsl(${(h+65)%360} 70% 26%))`}
function initials(name){return String(name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'♪'}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400)}
function sanitizeFilename(n){return String(n||'track').replace(/[\\/:*?"<>|]/g,'_').replace(/\.+$/,'').trim().slice(0,120)||'track'}
function downloadBlob(blob,filename){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),30000)}
function getTrackExt(track){
  const n=track.blob?.name||'';const ext=n.includes('.')?n.split('.').pop().toLowerCase():'';
  if(ext&&ext.length<=5)return ext;
  const m=(track.mime||'').toLowerCase();
  if(m.includes('mpeg'))return'mp3';if(m.includes('flac'))return'flac';if(m.includes('ogg'))return'ogg';
  if(m.includes('wav'))return'wav';if(m.includes('m4a')||m.includes('mp4'))return'm4a';
  if(m.includes('aac'))return'aac';if(m.includes('opus'))return'opus';return'mp3';
}

/* Clipboard */
async function copyToClipboard(text){
  if(!text)return false;
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true}}catch(e){}
  const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.top='-9999px';
  document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);return ok;
}
function buildLRC(track){if(!track)return'';if(track.lyricsSynced&&track.lyricsSynced.length){return track.lyricsSynced.map(l=>`[${fmtLRC(l.t)}] ${l.text}`).join('\n')}return track.lyrics||''}
async function copyCurrentLyrics(){
  const t=state.currentTrack;if(!t){toast('Нет активного трека');return}
  const text=buildLRC(t);if(!text.trim()){toast('У трека нет текста');return}
  const ok=await copyToClipboard(text);
  toast(ok?(t.lyricsSynced?.length?`LRC скопирован (${t.lyricsSynced.length} строк)`:'Текст скопирован'):'Не удалось скопировать');
}

/* LRC */
function parseLRC(text){
  const lines=String(text).split(/\r?\n/);const result=[];const re=/^\[(\d{1,2}):(\d{2})(?:[.:](\d{2,3}))?\]\s*(.*)$/;
  for(const line of lines){const m=line.match(re);if(m){const min=parseInt(m[1],10),sec=parseInt(m[2],10);const frac=m[3]?parseInt(m[3].padEnd(3,'0'),10)/1000:0;const t=min*60+sec+frac;const txt=m[4].trim();if(txt)result.push({t,text:txt})}}
  return result.sort((a,b)=>a.t-b.t);
}
function hasLRCFormat(text){return /\[\d{1,2}:\d{2}(?:[.:]\d{2,3})?\]/.test(String(text||''))}

/* LRCLIB */
async function fetchLyricsFromLRCLIB(track){
  const cleanTitle=String(track.title||'').replace(/\(.*?\)|\[.*?\]/g,'').trim();
  const artist=String(track.artist||'').replace(/\(.*?\)|\[.*?\]/g,'').trim();
  const album=albumById(track.albumId)?.title||'';
  const duration=Math.round(track.duration||0);
  const headers={'X-User-Agent':'SpotifyClone/1.0'};
  if(cleanTitle&&artist&&duration){
    const p=new URLSearchParams({track_name:cleanTitle,artist_name:artist,duration:String(duration)});
    if(album)p.set('album_name',album);
    try{const r=await fetch(`https://lrclib.net/api/get?${p}`,{headers});if(r.ok){const d=await r.json();if(d.syncedLyrics)return{synced:d.syncedLyrics,plain:d.plainLyrics};if(d.plainLyrics)return{synced:null,plain:d.plainLyrics}}}catch(e){}
  }
  if(cleanTitle){
    const q=[cleanTitle,artist].filter(Boolean).join(' ');
    try{const r=await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(q)}`,{headers});if(r.ok){const arr=await r.json();
      if(Array.isArray(arr)&&arr.length){let best=null,bd=Infinity;for(const it of arr){const diff=Math.abs((it.duration||0)-duration);if(diff<bd){bd=diff;best=it}}
        if(best?.syncedLyrics)return{synced:best.syncedLyrics,plain:best.plainLyrics};
        if(best?.plainLyrics)return{synced:null,plain:best.plainLyrics}}}}catch(e){}
  }
  return null;
}

/* ID3 USLT */
function encodeSynchsafe(n){return[(n>>21)&0x7f,(n>>14)&0x7f,(n>>7)&0x7f,n&0x7f]}
function decodeSynchsafe(b,o){return(b[o]<<21)|(b[o+1]<<14)|(b[o+2]<<7)|b[o+3]}
function encodeUTF16LE(str){const r=new Uint8Array(2+str.length*2);r[0]=0xFF;r[1]=0xFE;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);r[2+i*2]=c&0xff;r[3+i*2]=(c>>8)&0xff}return r}
function decodeUTF16LE(b){let start=0,le=true;if(b[0]===0xFF&&b[1]===0xFE)start=2;else if(b[0]===0xFE&&b[1]===0xFF){start=2;le=false}
  let out='';for(let i=start;i<b.length-1;i+=2){const code=le?(b[i]|(b[i+1]<<8)):((b[i]<<8)|b[i+1]);out+=String.fromCharCode(code)}return out}
function createUSLTFrame(text){const enc=new TextEncoder();const lyrics=encodeUTF16LE(text);const lang=enc.encode('eng');const dl=1+3+1+lyrics.length;const f=new Uint8Array(10+dl);f.set(enc.encode('USLT'),0);f[4]=(dl>>>24)&0xff;f[5]=(dl>>>16)&0xff;f[6]=(dl>>>8)&0xff;f[7]=dl&0xff;f[8]=0;f[9]=0;f[10]=1;f.set(lang,11);f[14]=0;f.set(lyrics,15);return f}
function buildID3v2(frames){const total=frames.reduce((s,f)=>s+f.length,0);const h=new Uint8Array(10);h.set(new TextEncoder().encode('ID3'),0);h[3]=3;h[4]=0;h[5]=0;h.set(encodeSynchsafe(total),6);const r=new Uint8Array(10+total);r.set(h,0);let o=10;for(const f of frames){r.set(f,o);o+=f.length}return r}
async function addLyricsToMP3(fileOrBlob,lyricsText){
  const buffer=await fileOrBlob.arrayBuffer();const bytes=new Uint8Array(buffer);
  let audioStart=0;const existing=[];
  if(bytes[0]===0x49&&bytes[1]===0x44&&bytes[2]===0x33){
    const ver=bytes[3];const flags=bytes[5];const size=decodeSynchsafe(bytes,6);
    audioStart=10+size+((flags&0x10)?10:0);let pos=10;const end=10+size;
    while(pos<end-9){if(bytes[pos]===0)break;const id=String.fromCharCode(bytes[pos],bytes[pos+1],bytes[pos+2],bytes[pos+3]);let fs;
      if(ver===4)fs=decodeSynchsafe(bytes,pos+4);else fs=(bytes[pos+4]<<24)|(bytes[pos+5]<<16)|(bytes[pos+6]<<8)|bytes[pos+7];
      if(fs<=0)break;if(id!=='USLT'&&id!=='SYLT')existing.push(bytes.slice(pos,pos+10+fs));pos+=10+fs}
  }
  const uslt=createUSLTFrame(lyricsText);const newTag=buildID3v2([...existing,uslt]);
  const result=new Uint8Array(newTag.length+bytes.length-audioStart);
  result.set(newTag,0);result.set(bytes.slice(audioStart),newTag.length);
  return new Blob([result],{type:'audio/mpeg'});
}
function readUSLTFromMP3(buffer){
  const bytes=new Uint8Array(buffer);
  if(bytes[0]!==0x49||bytes[1]!==0x44||bytes[2]!==0x33)return null;
  const ver=bytes[3];const size=decodeSynchsafe(bytes,6);let pos=10;const end=10+size;
  while(pos<end-9){if(bytes[pos]===0)break;const id=String.fromCharCode(bytes[pos],bytes[pos+1],bytes[pos+2],bytes[pos+3]);let fs;
    if(ver===4)fs=decodeSynchsafe(bytes,pos+4);else fs=(bytes[pos+4]<<24)|(bytes[pos+5]<<16)|(bytes[pos+6]<<8)|bytes[pos+7];
    if(fs<=0)break;
    if(id==='USLT'){const ds=pos+10;const enc=bytes[ds];let de=ds+4;
      if(enc===0||enc===3){while(de<ds+fs&&bytes[de]!==0)de++;de++}else{while(de<ds+fs-1){if(bytes[de]===0&&bytes[de+1]===0){de+=2;break}de+=2}}
      const data=bytes.slice(de,ds+fs);
      try{if(enc===0)return new TextDecoder('iso-8859-1').decode(data);
        if(enc===1||enc===2)return decodeUTF16LE(data);
        if(enc===3)return new TextDecoder('utf-8').decode(data)}catch(e){}}
    pos+=10+fs}
  return null;
}

/* Script loader */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Failed '+src));document.head.appendChild(s)})}
async function ensureJSZip(){if(window.JSZip)return;await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js')}

/* INDEXEDDB */
const DB_NAME='spotify-clone-db';const DB_VER=2;let db=null;
function openDB(){return new Promise((res,rej)=>{
  const req=indexedDB.open(DB_NAME,DB_VER);
  req.onupgradeneeded=e=>{const d=e.target.result;
    if(!d.objectStoreNames.contains('tracks')){const s=d.createObjectStore('tracks',{keyPath:'id'});s.createIndex('albumId','albumId')}
    if(!d.objectStoreNames.contains('albums'))d.createObjectStore('albums',{keyPath:'id'});
    if(!d.objectStoreNames.contains('playlists'))d.createObjectStore('playlists',{keyPath:'id'});};
  req.onsuccess=e=>{db=e.target.result;res(db)};req.onerror=e=>rej(e.target.error);});
}
function dbGetAll(store){return new Promise((res,rej)=>{const r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function dbPut(store,val){return new Promise((res,rej)=>{const r=db.transaction(store,'readwrite').objectStore(store).put(val);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function dbDelete(store,key){return new Promise((res,rej)=>{const r=db.transaction(store,'readwrite').objectStore(store).delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}

/* STATE */
let albums=[],tracks=[],playlists=[],pendingFiles=[];
let listRegistry={};
const urlCache=new Map();
const audio=$('#audio');
const state={queue:[],index:-1,currentTrack:null,isPlaying:false,shuffle:false,repeat:'off'};
const radio={active:false,seedTrackId:null,session:new Set(),disliked:new Set()};

/* COVERS */
function coverURL(album){
  if(!album||!album.cover)return null;
  const key='cover_'+album.id;
  if(!urlCache.has(key))urlCache.set(key,URL.createObjectURL(album.cover));
  return urlCache.get(key);
}
function trackCoverURL(track){
  if(track.cover){
    const key='tcover_'+track.id;
    if(!urlCache.has(key))urlCache.set(key,URL.createObjectURL(track.cover));
    return urlCache.get(key);
  }
  return coverURL(albumById(track.albumId));
}
function trackURL(track){
  if(!urlCache.has(track.id))urlCache.set(track.id,URL.createObjectURL(track.blob));
  return urlCache.get(track.id);
}
function albumById(id){return albums.find(a=>a.id===id)||null}
function playlistById(id){return playlists.find(p=>p.id===id)||null}
function tracksOfAlbum(id){return tracks.filter(t=>t.albumId===id).sort((a,b)=>(a.order||0)-(b.order||0)||a.addedAt-b.addedAt)}
function playlistTracks(pl){if(!pl)return[];return pl.trackIds.map(id=>tracks.find(t=>t.id===id)).filter(Boolean)}
function playlistCover(pl){const f=playlistTracks(pl)[0];return f?trackCoverURL(f):null}
function trackYear(track){if(track.year)return track.year;const al=albumById(track.albumId);return al?.year||''}

async function reloadData(){
  albums=await dbGetAll('albums');tracks=await dbGetAll('tracks');playlists=await dbGetAll('playlists');
  albums.sort((a,b)=>b.createdAt-a.createdAt);playlists.sort((a,b)=>b.createdAt-a.createdAt);
  renderSidebarAlbums();renderSidebarPlaylists();
}

function navigate(name,param=null){currentView={name,param};renderMain();$$('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view===name));if(window.innerWidth<=768)closeSidebar()}

}

function renderSidebarPlaylists(){
  const el=$('#sidePlaylists');if(!el)return;
  if(!playlists.length){el.innerHTML=`<div style="padding:10px 12px;font-size:12px;color:#666;line-height:1.6">Пока нет плейлистов</div>`;return}

/* TRACK ROWS */
function trackRowsHTML(list,listName,opts={}){
  listRegistry[listName]=list;
  if(!list.length)return `<div class="empty">${opts.emptyText||'Здесь пока нет треков'}</div>`;
  return `<div class="track-list">`+list.map((t,i)=>{
    const al=albumById(t.albumId);
    const url=trackCoverURL(t);
    const year=trackYear(t);
    const cover=url?`<div class="tr-cover"><img src="${url}" alt=""></div>`:`<div class="tr-cover" style="${coverStyle(t.title)}">${esc(initials(t.title))}</div>`;
    const isPlaying=state.currentTrack&&state.currentTrack.id===t.id;
    const hasLyrics=t.lyricsSynced?.length||(t.lyrics&&t.lyrics.trim());
    const artistLine=esc(t.artist||al?.artist||'Неизвестный исполнитель')+(year?' · '+year:'');
    const albumTitle=al?al.title:'—';
    return `<div class="track-row ${isPlaying?'playing':''}" data-list="${listName}" data-i="${i}" data-id="${t.id}">
      <div class="tr-index"><span class="num">${i+1}</span><span class="play"><svg viewBox="0 0 24 24" width="14" height="14" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span></div>
      ${cover}
      <div class="tr-main"><div class="tr-title">${esc(t.title)}</div><div class="tr-artist">${artistLine}</div></div>
      ${opts.showAlbum?`<div class="tr-album">${esc(albumTitle)}</div>`:`<div class="tr-album"></div>`}
      <div class="tr-lyrics">${hasLyrics?'TXT':''}</div>
      <div class="tr-dur">${fmt(t.duration)}</div>
      <button class="tr-menu" data-menu="${t.id}">⋯</button>
    </div>`;
  }).join('')+`</div>`;
}

/* HOME */
function renderHome(){
  const recent=[...tracks].sort((a,b)=>b.addedAt-a.addedAt).slice(0,15);
  let html=`<div class="page"><h1>Добро пожаловать 👋</h1>`;
  if(albums.length){
    html+=`<h2>Ваши альбомы</h2><div class="grid">`;

      const url=coverURL(a);const cnt=tracksOfAlbum(a.id).length;
      const inner=url?`<img src="${url}" alt="">`:`<span>${esc(initials(a.title))}</span>`;
      return `<div class="card-item" data-album="${a.id}">
        <div class="card-cover" style="${url?'':coverStyle(a.title)}">${inner}
          <button class="card-play" data-playalbum="${a.id}"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        </div>
        <div class="card-title">${esc(a.title)}</div>

    }).join('')+`</div>`;
  }

    html+=`<h2>Ваши плейлисты</h2><div class="grid">`;

      const url=playlistCover(pl);const cnt=playlistTracks(pl).length;
      return `<div class="card-item" data-playlist="${pl.id}">
        <div class="card-cover pl" style="${url?'':coverStyle(pl.title)}">
          ${url?`<img src="${url}" alt="">`:`<span>♪</span>`}
          <button class="card-play" data-playplaylist="${pl.id}"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        </div>
        <div class="card-title">${esc(pl.title)}</div>
        <div class="card-sub">Плейлист · ${cnt} ${plural(cnt,'трек','трека','треков')}</div>

  $('#main').innerHTML=html+`</div>`;
}
function plural(n,one,few,many){const m10=n%10,m100=n%100;if(m10===1&&m100!==11)return one;if(m10>=2&&m10<=4&&(m100<10||m100>=20))return few;return many}

/* ALBUM */

  const al=albumById(id);if(!al){navigate('home');return}
  const list=tracksOfAlbum(id);
  const totalSec=list.reduce((s,t)=>s+(t.duration||0),0);
  const url=coverURL(al);
  $('#main').innerHTML=`<div class="page">
    <div class="album-header">
      ${url?`<div class="big-cover"><img src="${url}" alt=""></div>`:`<div class="big-cover" style="${coverStyle(al.title)}">${esc(initials(al.title))}</div>`}
      <div style="min-width:0">
        <div class="eyebrow">Альбом</div>
        <h1>${esc(al.title)}</h1>
        <div class="muted">${esc(al.artist||'Неизвестный исполнитель')}${al.year?' · '+al.year:''} · ${list.length} ${plural(list.length,'трек','трека','треков')} · ${fmt(totalSec)}</div>
      </div>
    </div>
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:22px;flex-wrap:wrap">
      <button class="btn accent" id="playAlbumBtn" ${list.length?'':'disabled'}><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Слушать</button>
      <button class="btn ghost small" id="radioAlbumBtn" ${list.length?'':'disabled'}>📻 Радио по альбому</button>
      <button class="btn ghost small" id="addToAlbumBtn">+ Добавить треки</button>
      <button class="btn ghost small" id="exportAlbumBtn">💾 Скачать ZIP</button>
      <button class="btn ghost small" id="deleteAlbumBtn">Удалить альбом</button>
    </div>
    ${trackRowsHTML(list,'album',{showAlbum:false})}
  </div>`;
  $('#playAlbumBtn')?.addEventListener('click',()=>playFromList(list,0));
  $('#radioAlbumBtn')?.addEventListener('click',()=>{
    if(!list.length)return;
    startRadioFromAlbum(al, list[Math.floor(Math.random()*list.length)]);
  });
  $('#addToAlbumBtn')?.addEventListener('click',()=>{navigate('upload');setTimeout(()=>{const sel=$('#albumSelect');if(sel){sel.value=al.id;sel.dispatchEvent(new Event('change'))}},50)});
  $('#exportAlbumBtn')?.addEventListener('click',()=>exportAlbum(al));
  $('#deleteAlbumBtn')?.addEventListener('click',async()=>{
    if(!confirm(`Удалить альбом «${al.title}» и все его треки?`))return;
    for(const t of list){await dbDelete('tracks',t.id);urlCache.delete(t.id)}
    await dbDelete('albums',al.id);await reloadData();toast('Альбом удалён');navigate('home');
  });
}

        <div class="mli-info"><div class="mli-title">${esc(p.title)}</div><div class="mli-sub">${p.trackIds.length} ${plural(p.trackIds.length,'трек','трека','треков')}${already?' · уже добавлен':''}</div></div>

/* SEARCH */
function renderSearch(){
  $('#main').innerHTML=`<div class="page"><h1>Поиск</h1>

    <div id="searchResults"></div></div>`;
  const doSearch=()=>{
    const q=$('#searchInput').value.trim().toLowerCase();const box=$('#searchResults');
    if(!q){box.innerHTML=`<div class="empty">Введите запрос</div>`;return}
    const fT=tracks.filter(t=>t.title.toLowerCase().includes(q)||(t.artist||'').toLowerCase().includes(q));
    const fA=albums.filter(a=>a.title.toLowerCase().includes(q)||(a.artist||'').toLowerCase().includes(q));

    let html='';
    if(fA.length){html+=`<h2>Альбомы</h2><div class="grid">`+fA.map(a=>{
      const url=coverURL(a);
      return `<div class="card-item" data-album="${a.id}"><div class="card-cover" style="${url?'':coverStyle(a.title)}">${url?`<img src="${url}">`:`<span>${esc(initials(a.title))}</span>`}</div><div class="card-title">${esc(a.title)}</div><div class="card-sub">${esc(a.artist||'')}${a.year?' · '+a.year:''}</div></div>`;
    }).join('')+`</div>`}
    if(fP.length){html+=`<h2>Плейлисты</h2><div class="grid">`+fP.map(pl=>{
      const url=playlistCover(pl);
      return `<div class="card-item" data-playlist="${pl.id}"><div class="card-cover pl" style="${url?'':coverStyle(pl.title)}">${url?`<img src="${url}">`:`<span>♪</span>`}</div><div class="card-title">${esc(pl.title)}</div><div class="card-sub">${pl.trackIds.length} ${plural(pl.trackIds.length,'трек','трека','треков')}</div></div>`;
    }).join('')+`</div>`}

const AUDIO_EXT=/\.(mp3|wav|ogg|oga|flac|m4a|aac|opus|weba|aiff|aif|wma)$/i;
async function addFiles(fileList){

function getDuration(blob){return new Promise(res=>{const url=URL.createObjectURL(blob);const a=new Audio();a.preload='metadata';const done=d=>{URL.revokeObjectURL(url);res(isFinite(d)?d:0)};a.onloadedmetadata=()=>done(a.duration);a.onerror=()=>done(0);setTimeout(()=>done(a.duration||0),8000);a.src=url})}

function playFromList(list, index, opts = {}) {

    // ручной запуск — радио выключаем

}
function loadCurrent(autoplay = true) {
  const t = state.queue[state.index];
  if (!t) return;
  state.currentTrack = t;
  if (radio.active) radio.session.add(t.id);
  audio.src = trackURL(t);
  audio.currentTime = 0;
  if (autoplay) {
    audio.play().then(() => { state.isPlaying = true; updatePlayerUI(); })
                .catch(() => { state.isPlaying = false; updatePlayerUI(); });
  }
  updatePlayerUI();
  updateLyricsPanel();
  refreshPlayingHighlight();
  renderQueuePanel();
}
function togglePlay() {
  if (!state.currentTrack) {
    const all = [...tracks].sort((a, b) => b.addedAt - a.addedAt);
    if (all.length) playFromList(all, 0);
    return;
  }
  if (audio.paused) {
    audio.play().then(() => { state.isPlaying = true; updatePlayerUI(); });
  } else {
    audio.pause();
    state.isPlaying = false;
    updatePlayerUI();
  }
}
function nextTrack(user = true) {
  if (!state.queue.length) return;
  if (state.shuffle && state.queue.length > 1) {
    let n;
    do { n = Math.floor(Math.random() * state.queue.length); } while (n === state.index);
    state.index = n; loadCurrent(); return;
  }
  if (state.index < state.queue.length - 1) { state.index++; loadCurrent(); }
  else if (radio.active) {
    fillRadioQueue();
    if (state.index < state.queue.length - 1) { state.index++; loadCurrent(); }
    else { state.isPlaying = false; updatePlayerUI(); }
  }
  else if (state.repeat === 'all') { state.index = 0; loadCurrent(); }
  else if (!user) { state.isPlaying = false; updatePlayerUI(); }
}

  if (!state.queue.length) return;

/* RADIO */
function trackScore(candidate, seed) {
  if (!seed || candidate.id === seed.id) return -1;
  let score = 0;
  if (candidate.artist && seed.artist && candidate.artist === seed.artist) score += 10;
  if (candidate.albumId && seed.albumId && candidate.albumId === seed.albumId) score += 5;
  const plsWithSeed = playlists.filter(p => p.trackIds.includes(seed.id));
  for (const pl of plsWithSeed) {
    if (pl.trackIds.includes(candidate.id)) { score += 2; break; }
  }
  const cy = trackYear(candidate), sy = trackYear(seed);
  if (cy && sy && Math.abs(cy - sy) <= 2) score += 1;
  return score;
}

function pickRadioNext(seed, count) {
  const pool = tracks.filter(t =>
    t.id !== seed.id &&
    !radio.session.has(t.id) &&
    !radio.disliked.has(t.id)
  );
  if (!pool.length) return [];

  const scored = pool.map(t => {
    const base = Math.max(0, trackScore(t, seed));
    const jitter = 1 + Math.random() * 0.4;
    return { track: t, weight: (base + 0.5) * jitter };
  });

  const picked = [];
  const usedArtists = new Set();
  const result = [];

  while (result.length < count && scored.length) {
    const total = scored.reduce((s, x) => s + x.weight, 0);
    if (total <= 0) break;
    let r = Math.random() * total;
    let idx = 0;
    for (; idx < scored.length; idx++) {
      r -= scored[idx].weight;
      if (r <= 0) break;
    }
    if (idx >= scored.length) idx = scored.length - 1;
    const chosen = scored[idx].track;
    // anti-repeat для исполнителя: не больше 2 подряд от одного артиста
    let artistCount = 0;
    for (let k = result.length - 1; k >= Math.max(0, result.length - 3); k--) {
      if (result[k].artist === chosen.artist) artistCount++;
    }
    if (chosen.artist && artistCount >= 2) {
      scored.splice(idx, 1);
      continue;
    }
    result.push(chosen);
    scored.splice(idx, 1);
  }
  return result;
}

function fillRadioQueue() {
  if (!radio.active) return;
  const seed = tracks.find(t => t.id === radio.seedTrackId) || state.currentTrack;
  if (!seed) return;
  const more = pickRadioNext(seed, 12);
  state.queue.push(...more);
}

function startRadioFromTrack(track) {
  if (!track || !tracks.length) { toast('Библиотека пуста'); return; }
  radio.active = true;
  radio.seedTrackId = track.id;
  radio.session.clear();
  radio.disliked.clear();
  state.queue = [track];
  state.index = 0;

}

function startRadioFromAlbum(album, seedTrack) {
  if (!album) return;
  if (!seedTrack) {
    const list = tracksOfAlbum(album.id);
    if (!list.length) { toast('В альбоме нет треков'); return; }
    seedTrack = list[Math.floor(Math.random() * list.length)];
  }
  radio.active = true;
  radio.seedTrackId = seedTrack.id;
  radio.session.clear();
  radio.disliked.clear();
  const albumTracks = tracksOfAlbum(album.id);
  const shuffled = [...albumTracks].sort(() => Math.random() - 0.5);
  state.queue = shuffled;
  state.index = shuffled.findIndex(t => t.id === seedTrack.id);
  if (state.index < 0) state.index = 0;
  fillRadioQueue();
  loadCurrent();
  toast(`📻 Радио по альбому «${album.title}»`);
}

function dislikeCurrentRadio() {
  if (!radio.active || !state.currentTrack) { toast('Радио не активно'); return; }
  radio.disliked.add(state.currentTrack.id);
  // убираем текущий из сессии и играем следующий
  if (state.index < state.queue.length - 1) {
    state.queue.splice(state.index, 1);
    if (state.index >= state.queue.length) state.index = state.queue.length - 1;
    loadCurrent();

  }
}

function startDrag(e) {
  e.preventDefault();
  const handle = e.currentTarget;
  const item = handle.closest('.queue-item');
  if (!item) return;
  const items = [...$('#queueListBody').querySelectorAll('.queue-item')];
  const idx = items.indexOf(item);
  if (idx < 0 || idx === state.index) return;

  const rect = item.getBoundingClientRect();
  const placeholder = document.createElement('div');
  placeholder.style.height = rect.height + 'px';
  placeholder.style.margin = '4px 0';
  placeholder.style.background = 'rgba(29,185,84,.15)';
  placeholder.style.borderRadius = '6px';

  item.classList.add('dragging');
  item.style.position = 'fixed';
  item.style.left = rect.left + 'px';
  item.style.top = rect.top + 'px';
  item.style.width = rect.width + 'px';
  item.style.zIndex = '500';
  item.style.pointerEvents = 'none';
  document.body.appendChild(item);
  item.parentNode !== document.body && item.parentNode.insertBefore(placeholder, item.nextSibling);

  const placeholderAnchor = document.createElement('div');
  // insert placeholder in original position within list
  item._origParent = $('#queueListBody');
  item._origNext = items[idx + 1] || null;
  $('#queueListBody').insertBefore(placeholder, item._origNext);

  const offsetY = e.clientY - rect.top;
  let currentIdx = idx;

  dragState = {
    item, placeholder, startY: e.clientY, offsetY, currentIdx, origIdx: idx,
    lastY: e.clientY
  };

  document.addEventListener('pointermove', onDragMove, { passive: false });
  document.addEventListener('pointerup', onDragEnd);
  document.addEventListener('pointercancel', onDragEnd);
}

function onDragMove(e) {
  if (!dragState) return;
  e.preventDefault();
  const { item, placeholder } = dragState;
  const y = e.clientY;
  item.style.top = (y - dragState.offsetY) + 'px';

  const body = $('#queueListBody');
  const items = [...body.children].filter(c => c !== item);
  const phIdx = items.indexOf(placeholder);

  // определить ближайший элемент
  let closest = null;
  let closestDist = Infinity;
  for (const el of items) {
    if (el === placeholder) continue;
    const r = el.getBoundingClientRect();
    const mid = r.top + r.height / 2;
    const d = Math.abs(y - mid);
    if (d < closestDist) { closestDist = d; closest = el; }
  }
  if (closest) {
    const r = closest.getBoundingClientRect();
    const mid = r.top + r.height / 2;
    if (y < mid) {
      body.insertBefore(placeholder, closest);
    } else {
      body.insertBefore(placeholder, closest.nextSibling);
    }
  }

  const newIdx = [...body.children].indexOf(placeholder);
  dragState.currentIdx = newIdx;
}

function onDragEnd(e) {
  if (!dragState) return;
  const { item, placeholder, origIdx, currentIdx } = dragState;

  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', onDragEnd);
  document.removeEventListener('pointercancel', onDragEnd);

  // если индекс не изменился или перенёс на текущий — отменяем
  if (currentIdx === origIdx || currentIdx === state.index) {
    placeholder.parentNode && placeholder.parentNode.removeChild(placeholder);
    item.classList.remove('dragging');
    item.removeAttribute('style');
    // вернуть в исходное место
    const body = $('#queueListBody');
    const items = [...body.querySelectorAll('.queue-item')];
    const ref = items[origIdx] || null;
    if (ref) body.insertBefore(item, ref);
    else body.appendChild(item);
    dragState = null;
    return;
  }

  // применение перестановки
  placeholder.parentNode && placeholder.parentNode.removeChild(placeholder);
  item.classList.remove('dragging');
  item.removeAttribute('style');

  const body = $('#queueListBody');
  const newRefs = [...body.querySelectorAll('.queue-item')];
  let targetBefore = null;
  let count = 0;
  for (const el of [...body.children]) {
    if (el === placeholder) continue;
    if (count === currentIdx) { targetBefore = el; break; }
    if (!el.classList.contains('queue-item')) continue;
    count++;
  }
  // просто вставим по позиции currentIdx среди queue-item
  const allItems = [...body.querySelectorAll('.queue-item')];
  // placeholder уже удалён
  const realIdx = currentIdx;
  const beforeEl = allItems[realIdx] || null;
  if (beforeEl) body.insertBefore(item, beforeEl);
  else body.appendChild(item);

  // реально переставить в state.queue
  const moved = state.queue.splice(origIdx, 1)[0];
  let targetIdx = realIdx;
  // корректируем относительно текущего индекса
  if (origIdx < state.index) state.index--;
  if (origIdx < targetIdx) targetIdx--;
  if (targetIdx < 0) targetIdx = 0;
  if (targetIdx > state.queue.length) targetIdx = state.queue.length;
  state.queue.splice(targetIdx, 0, moved);
  if (origIdx > state.index && targetIdx <= state.index) state.index++;
  if (origIdx < state.index && targetIdx >= state.index) state.index++;

  dragState = null;
  renderQueuePanel();
  refreshPlayingHighlight();
}

function removeFromQueue(i) {
  if (i === state.index) return;
  if (i < state.index) state.index--;
  state.queue.splice(i, 1);
  renderQueuePanel();
  refreshPlayingHighlight();
}

/* EXPORT */
async function exportTrack(track) {
  const lrc = buildLRC(track);
  const ext = getTrackExt(track);
  const base = sanitizeFilename(track.title || 'track');

  if (!lrc.trim() && !track.cover && !track.year) {
    downloadBlob(track.blob, base + '.' + ext);
    toast('Скачано: ' + base + '.' + ext);
    return;
  }

  if (ext === 'mp3' && lrc.trim() && !track.cover) {
    try {
      const blob = await addLyricsToMP3(track.blob, lrc);
      downloadBlob(blob, base + '.mp3');
      toast('Скачано с текстом внутри MP3');
      return;
    } catch (e) { console.warn(e); }
  }

  await ensureJSZip();
  const zip = new JSZip();
  zip.file(base + '.' + ext, track.blob);
  if (lrc.trim()) zip.file(base + '.lrc', lrc);
  if (track.cover) zip.file('cover.jpg', track.cover);
  const meta = {
    title: track.title,
    artist: track.artist || '',
    year: track.year || '',
    albumId: track.albumId || null
  };
  if (track.albumId) {
    const al = albumById(track.albumId);
    if (al) {
      meta.album = al.title;
      meta.albumArtist = al.artist || '';
      meta.albumYear = al.year || '';
    }
  }
  zip.file(base + '.meta.json', JSON.stringify(meta, null, 2));
  const blob = await zip.generateAsync({ type: 'blob' });
  downloadBlob(blob, base + '.zip');
  toast('Скачано: ZIP (файл + .lrc + превью + метаданные)');
}

async function exportAlbum(album) {
  const list = tracksOfAlbum(album.id);
  if (!list.length) { toast('В альбоме нет треков'); return; }
  await ensureJSZip();
  const zip = new JSZip();
  const folder = zip.folder(sanitizeFilename(album.title));
  if (album.cover) folder.file('cover.jpg', album.cover);
  folder.file('metadata.json', JSON.stringify({
    title: album.title,
    artist: album.artist || '',
    year: album.year || ''
  }, null, 2));
  list.forEach((t, i) => {
    const num = String(i + 1).padStart(2, '0');
    const base = `${num} - ${sanitizeFilename(t.title)}`;
    folder.file(base + '.' + getTrackExt(t), t.blob);
    const lrc = buildLRC(t);
    if (lrc.trim()) folder.file(base + '.lrc', lrc);
  });
  const blob = await zip.generateAsync({ type: 'blob' });
  downloadBlob(blob, sanitizeFilename(album.title) + '.zip');
  toast('Альбом скачан как ZIP');
}

async function exportPlaylist(pl) {
  const list = playlistTracks(pl);
  if (!list.length) { toast('Плейлист пуст'); return; }
  await ensureJSZip();
  const zip = new JSZip();
  list.forEach((t, i) => {
    const num = String(i + 1).padStart(2, '0');
    const base = `${num} - ${sanitizeFilename(t.title)}`;
    zip.file(base + '.' + getTrackExt(t), t.blob);
    const lrc = buildLRC(t);
    if (lrc.trim()) zip.file(base + '.lrc', lrc);
  });
  const blob = await zip.generateAsync({ type: 'blob' });
  downloadBlob(blob, sanitizeFilename(pl.title) + '.zip');
  toast('Плейлист скачан как ZIP');
}

function hideImportOverlay() {

async function importZipFile(file) {
  showImportOverlay('Загрузка JSZip...');
  try { await ensureJSZip(); }
  catch (e) {
    hideImportOverlay();
    toast('Не удалось загрузить JSZip (нужен интернет)');
    return;
  }
  showImportOverlay('Чтение архива...');
  let zip;
  try { zip = await JSZip.loadAsync(file); }
  catch (e) { hideImportOverlay(); toast('Повреждённый ZIP'); return; }

  const albumMap = new Map();
  const rootAudio = [];
  const rootLrcs = new Map();
  const rootCovers = new Map();
  const rootMetas = new Map();
  const allPaths = [];

  for (const [path, entry] of Object.entries(zip.files)) {
    if (entry.dir) continue;
    if (path.startsWith('__MACOSX/') || path.includes('/._') || path.split('/').some(p => p.startsWith('.'))) continue;
    allPaths.push({ path, entry });
  }

  for (const { path, entry } of allPaths) {
    const parts = path.split('/');
    const fileName = parts[parts.length - 1];
    const folder = parts.slice(0, -1).join('/');
    const lower = fileName.toLowerCase();
    const ext = lower.split('.').pop();

    if (AUDIO_EXT.test(fileName)) {
      if (folder) {
        if (!albumMap.has(folder)) albumMap.set(folder, { audio: [], lrcs: new Map(), cover: null, meta: null });
        albumMap.get(folder).audio.push({ path, fileName, entry });
      } else {
        rootAudio.push({ path, fileName, entry });
      }
    } else if (ext === 'lrc') {
      const base = fileName.replace(/\.lrc$/i, '').toLowerCase();
      if (folder) {
        if (!albumMap.has(folder)) albumMap.set(folder, { audio: [], lrcs: new Map(), cover: null, meta: null });
        albumMap.get(folder).lrcs.set(base, entry);
      } else {
        rootLrcs.set(base, entry);
      }
    } else if (/\.(jpg|jpeg|png|webp|gif)$/i.test(fileName)) {
      if (folder && /^(cover|folder|front)\.(jpg|jpeg|png|webp)$/i.test(fileName)) {
        if (!albumMap.has(folder)) albumMap.set(folder, { audio: [], lrcs: new Map(), cover: null, meta: null });
        albumMap.get(folder).cover = entry;
      } else if (!folder && /^cover\.(jpg|jpeg|png|webp)$/i.test(fileName)) {
        rootCovers.set('cover.jpg', entry);
      }
    } else if (lower === 'metadata.json' || lower === 'album.json') {
      if (folder) {
        if (!albumMap.has(folder)) albumMap.set(folder, { audio: [], lrcs: new Map(), cover: null, meta: null });
        albumMap.get(folder).meta = entry;
      }
    } else if (ext === 'json' && lower.endsWith('.meta.json')) {
      const base = fileName.replace(/\.meta\.json$/i, '').toLowerCase();
      if (!folder) {
        rootMetas.set(base, entry);
      }
    }
  }

  let createdAlbums = 0, createdTracks = 0;
  const totalFolders = albumMap.size;

  for (const [folderPath, data] of albumMap.entries()) {
    if (!data.audio.length) continue;
    showImportOverlay(`Альбом ${createdAlbums + 1} из ${totalFolders}: ${folderPath}`);
    let title = folderPath.split('/').pop();
    let artist = 'Неизвестный исполнитель';
    let year = '';
    if (data.meta) {
      try {
        const meta = JSON.parse(await data.meta.async('string'));
        if (meta.title) title = meta.title;
        if (meta.artist) artist = meta.artist;
        if (meta.year) year = meta.year;
      } catch (e) {}
    }
    let coverBlob = null;
    if (data.cover) {
      try { coverBlob = await data.cover.async('blob'); } catch (e) {}
    }
    const album = { id: uid(), title, artist, year, cover: coverBlob, createdAt: Date.now() };
    await dbPut('albums', album);

    data.audio.sort((a, b) => {
      const na = a.fileName.match(/^(\d+)/), nb = b.fileName.match(/^(\d+)/);
      if (na && nb) return parseInt(na[1]) - parseInt(nb[1]);
      return a.fileName.localeCompare(b.fileName);
    });

    let order = 0;
    for (const a of data.audio) {
      const blob = await a.entry.async('blob');
      const baseName = a.fileName.replace(/\.[^.]+$/, '');
      const cleanTitle = baseName.replace(/^\d+[\s._-]*/, '').trim() || baseName;

      let lrc = null;
      const lrcEntry = data.lrcs.get(baseName.toLowerCase());
      if (lrcEntry) { try { lrc = await lrcEntry.async('string'); } catch (e) {} }
      if (!lrc && a.fileName.toLowerCase().endsWith('.mp3')) {
        try { lrc = readUSLTFromMP3(await blob.arrayBuffer()); } catch (e) {}
      }

      const track = {
        id: uid(),
        title: cleanTitle,
        artist,
        albumId: album.id,
        blob,
        mime: blob.type || 'audio/mpeg',
        duration: await getDuration(blob),
        lyrics: lrc || '',
        lyricsSynced: lrc && hasLRCFormat(lrc) ? parseLRC(lrc) : null,
        addedAt: Date.now(),
        order: order++
      };
      await dbPut('tracks', track);
      createdTracks++;
    }
    createdAlbums++;
  }

  for (const a of rootAudio) {
    showImportOverlay(`Сингл: ${a.fileName}`);
    const blob = await a.entry.async('blob');
    const baseName = a.fileName.replace(/\.[^.]+$/, '');
    const cleanTitle = baseName.replace(/^\d+[\s._-]*/, '').trim() || baseName;

    let lrc = null;
    const lrcEntry = rootLrcs.get(baseName.toLowerCase());
    if (lrcEntry) { try { lrc = await lrcEntry.async('string'); } catch (e) {} }
    if (!lrc && a.fileName.toLowerCase().endsWith('.mp3')) {
      try { lrc = readUSLTFromMP3(await blob.arrayBuffer()); } catch (e) {}
    }

    let meta = {};
    const metaEntry = rootMetas.get(baseName.toLowerCase());
    if (metaEntry) { try { meta = JSON.parse(await metaEntry.async('string')); } catch (e) {} }

    let coverBlob = null;
    if (rootCovers.get('cover.jpg')) { try { coverBlob = await rootCovers.get('cover.jpg').async('blob'); } catch (e) {} }

    const track = {
      id: uid(),
      title: meta.title || cleanTitle,
      artist: meta.artist || 'Неизвестный исполнитель',
      albumId: null,
      blob,
      mime: blob.type || 'audio/mpeg',
      duration: await getDuration(blob),
      lyrics: lrc || '',
      lyricsSynced: lrc && hasLRCFormat(lrc) ? parseLRC(lrc) : null,
      year: meta.year || '',
      cover: coverBlob,
      addedAt: Date.now(),
      order: 0
    };
    await dbPut('tracks', track);
    createdTracks++;
  }

  hideImportOverlay();
  await reloadData();
  navigate('home');
  toast(`Импортировано: ${createdAlbums} альбомов, ${createdTracks} треков`);
}

/* CONTEXT MENU */
function closeCtxMenu() { document.querySelectorAll('.ctx-menu').forEach(m => m.remove()); }

function openTrackMenu(rect, track, playlistId = null) {
  closeCtxMenu();
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';

  const lyricsLabel = track.lyricsSynced?.length
    ? '⏱ Редактировать синхронизацию'
    : (track.lyrics ? '🎯 Синхронизировать текст' : '📝 Добавить текст');

  let html = `
    <button data-act="play">▶ Воспроизвести</button>
    <button data-act="radio">📻 Радио по треку</button>
    <button data-act="addto">➕ В плейлист...</button>
    <button data-act="queue">➕ В очередь</button>
    <button data-act="lyrics">${lyricsLabel}</button>
    <button data-act="download">💾 Скачать${buildLRC(track).trim() ? ' с текстом' : ''}</button>
    <button data-act="rename">✏️ Переименовать</button>
  `;
  if (playlistId) html += `<button data-act="rmplaylist" class="danger">✕ Убрать из плейлиста</button>`;
  html += `<button data-act="delete" class="danger">🗑 Удалить трек</button>`;
  menu.innerHTML = html;
  document.body.appendChild(menu);

  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let x = rect.left, y = rect.bottom + 6;
  if (x + mw > innerWidth - 10) x = innerWidth - mw - 10;
  if (y + mh > innerHeight - 10) y = rect.top - mh - 6;
  menu.style.left = Math.max(10, x) + 'px';
  menu.style.top = Math.max(10, y) + 'px';

  menu.addEventListener('click', async e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (!act) return;
    closeCtxMenu();

    if (act === 'play') playFromList([track], 0);
    else if (act === 'radio') startRadioFromTrack(track);
    else if (act === 'addto') openAddToPlaylistModal(track.id);
    else if (act === 'queue') {
      state.queue.push(track);
      if (state.index < 0) { state.index = 0; loadCurrent(); }
      else renderQueuePanel();
      toast('Добавлено в очередь');
    }
    else if (act === 'download') exportTrack(track);
    else if (act === 'rmplaylist' && playlistId) {
      const pl = playlistById(playlistId);
      if (!pl) return;
      pl.trackIds = pl.trackIds.filter(id => id !== track.id);
      await dbPut('playlists', pl);
      await reloadData();
      renderMain();
      toast('Убрано из плейлиста');
    }
    else if (act === 'lyrics') openLyricsModal(track);
    else if (act === 'rename') {
      openModal('Переименовать трек', `
        <input type="text" id="mTitle" value="${esc(track.title)}" style="width:100%;margin-bottom:10px" placeholder="Название">
        <input type="text" id="mArtist" value="${esc(track.artist || '')}" style="width:100%;margin-bottom:10px" placeholder="Исполнитель">
        <input type="number" id="mYear" value="${esc(track.year || '')}" placeholder="Год" min="1900" max="2100" style="width:100%">
      `, async () => {
        track.title = $('#mTitle').value.trim() || track.title;
        track.artist = $('#mArtist').value.trim();
        const y = parseInt($('#mYear').value, 10);
        track.year = isFinite(y) ? y : (track.year || '');
        await dbPut('tracks', track);
        await reloadData();
        renderMain();
        if (state.currentTrack?.id === track.id) {
          state.currentTrack = track;
          updatePlayerUI();
        }
        toast('Сохранено');
      });
    }
    else if (act === 'delete') {
      if (!confirm(`Удалить трек «${track.title}»?`)) return;
      await dbDelete('tracks', track.id);
      urlCache.delete(track.id);
      for (const pl of playlists) {
        if (pl.trackIds.includes(track.id)) {
          pl.trackIds = pl.trackIds.filter(id => id !== track.id);
          await dbPut('playlists', pl);
        }
      }
      await reloadData();
      if (state.currentTrack?.id === track.id) {
        audio.pause(); audio.removeAttribute('src'); audio.load();
        state.currentTrack = null; state.queue = []; state.index = -1;
        state.isPlaying = false;
        updatePlayerUI(); updateLyricsPanel();
        renderQueuePanel();
      }
      renderMain();
      toast('Трек удалён');
    }
  });
}
