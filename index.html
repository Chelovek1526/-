<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Spotify Clone</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #121212; --panel: #181818; --panel-h: #282828;
    --accent: #1db954; --accent-h: #1ed760;
    --text: #fff; --muted: #b3b3b3; --border: #2a2a2a;
  }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea, select { font-family: inherit; }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #4d4d4d; border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: #6a6a6a; }

  .app { display: grid; grid-template-columns: 250px 1fr; grid-template-rows: 1fr 92px; height: 100vh; height: 100dvh; }

  .sidebar { grid-row: 1; grid-column: 1; background: #000; padding: 20px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .logo { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; font-size: 20px; font-weight: 700; }
  .logo .dot { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; color: #000; font-size: 15px; }
  .nav-item { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 6px; color: var(--muted); font-weight: 600; font-size: 14px; transition: .15s; width: 100%; text-align: left; }
  .nav-item:hover { color: #fff; background: #1a1a1a; }
  .nav-item.active { color: #fff; background: #1f1f1f; }
  .nav-item svg { flex-shrink: 0; }
  .side-title { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 1.2px; padding: 18px 12px 8px; text-transform: uppercase; display: flex; align-items: center; justify-content: space-between; }
  .side-title button { color: var(--muted); font-size: 20px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; line-height: 1; transition: .15s; }
  .side-title button:hover { color: #fff; background: #2a2a2a; }
  .side-album { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; font-size: 13px; color: var(--muted); transition: .15s; width: 100%; text-align: left; }
  .side-album:hover { background: #1a1a1a; color: #fff; }
  .side-album .mini-cover { width: 34px; height: 34px; border-radius: 4px; flex-shrink: 0; display: grid; place-items: center; font-size: 11px; font-weight: 700; overflow: hidden; }
  .side-album .mini-cover img { width: 100%; height: 100%; object-fit: cover; }
  .side-album .mini-cover.pl { border-radius: 50%; }

  .main { grid-row: 1; grid-column: 2; overflow-y: auto; position: relative; background: linear-gradient(180deg, #1c1c1c 0%, #121212 320px); -webkit-overflow-scrolling: touch; }
  .page { padding: 28px 32px 60px; }
  h1 { font-size: 32px; margin-bottom: 22px; letter-spacing: -.5px; }
  h2 { font-size: 21px; margin: 28px 0 16px; letter-spacing: -.3px; }
  .muted { color: var(--muted); font-size: 13px; }
  .empty { padding: 50px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: 10px; font-size: 14px; line-height: 1.7; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 18px; }
  .card-item { background: var(--panel); border-radius: 8px; padding: 14px; cursor: pointer; transition: background .2s; position: relative; }
  .card-item:hover { background: var(--panel-h); }
  .card-cover { aspect-ratio: 1; border-radius: 6px; margin-bottom: 12px; overflow: hidden; display: grid; place-items: center; font-size: 34px; font-weight: 800; color: rgba(255,255,255,.85); position: relative; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
  .card-cover.pl { border-radius: 50%; }
  .card-cover img { width: 100%; height: 100%; object-fit: cover; }
  .card-play { position: absolute; right: 10px; bottom: 10px; width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #000; display: grid; place-items: center; opacity: 0; transform: translateY(8px); transition: .2s; box-shadow: 0 6px 16px rgba(0,0,0,.5); }
  .card-item:hover .card-play { opacity: 1; transform: none; }
  .card-play:hover { background: var(--accent-h); transform: scale(1.05); }
  .card-title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-sub { color: var(--muted); font-size: 12px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .track-list { display: flex; flex-direction: column; }
  .track-row { display: grid; grid-template-columns: 32px 42px 1fr 130px 42px 52px 34px; align-items: center; gap: 14px; padding: 8px 12px; border-radius: 6px; cursor: pointer; transition: background .12s; }
  .track-row:hover { background: #232323; }
  .track-row.playing .tr-title { color: var(--accent); }
  .tr-index { color: var(--muted); font-size: 14px; text-align: center; position: relative; }
  .tr-index .play { display: none; }
  .track-row:hover .tr-index .num { display: none; }
  .track-row:hover .tr-index .play { display: block; }
  .tr-cover { width: 42px; height: 42px; border-radius: 4px; overflow: hidden; display: grid; place-items: center; font-size: 14px; font-weight: 700; }
  .tr-cover img { width: 100%; height: 100%; object-fit: cover; }
  .tr-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tr-artist { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tr-album { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tr-lyrics { font-size: 10px; font-weight: 700; color: var(--accent); letter-spacing: .5px; text-align: center; }
  .tr-dur { font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .tr-menu { font-size: 18px; color: var(--muted); width: 30px; height: 30px; border-radius: 50%; opacity: 0; transition: .15s; }
  .track-row:hover .tr-menu { opacity: 1; }
  .tr-menu:hover { background: #3a3a3a; color: #fff; }

  .album-header { display: flex; gap: 26px; align-items: flex-end; padding: 22px 0 30px; }
  .album-header .big-cover { width: 200px; height: 200px; border-radius: 8px; flex-shrink: 0; display: grid; place-items: center; font-size: 62px; font-weight: 800; color: rgba(255,255,255,.9); box-shadow: 0 12px 40px rgba(0,0,0,.6); overflow: hidden; }
  .album-header .big-cover.pl { border-radius: 50%; }
  .album-header .big-cover img { width: 100%; height: 100%; object-fit: cover; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .album-header h1 { font-size: 48px; margin: 0 0 14px; line-height: 1.05; }
  .album-header .pl-desc { font-size: 13px; color: var(--muted); margin-bottom: 6px; max-width: 600px; }

  .btn { padding: 10px 22px; border-radius: 500px; font-weight: 700; font-size: 14px; transition: .15s; display: inline-flex; align-items: center; gap: 8px; }
  .btn.accent { background: var(--accent); color: #000; }
  .btn.accent:hover { background: var(--accent-h); transform: scale(1.03); }
  .btn.accent:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .btn.ghost { border: 1px solid #666; color: #fff; }
  .btn.ghost:hover { border-color: #fff; }
  .btn.small { padding: 7px 14px; font-size: 13px; }

  .card-box { background: var(--panel); border-radius: 12px; padding: 22px; max-width: 820px; }
  .field-row { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .field-row label { font-size: 13px; color: var(--muted); font-weight: 600; min-width: 70px; }
  input[type=text], input[type=search], select, textarea { background: #2a2a2a; border: 1px solid #3a3a3a; color: #fff; border-radius: 6px; padding: 10px 12px; font-size: 14px; outline: none; transition: .15s; }
  input[type=text]:focus, select:focus, textarea:focus { border-color: var(--accent); background: #333; }
  select { cursor: pointer; }
  textarea { width: 100%; min-height: 110px; resize: vertical; line-height: 1.5; font-size: 13px; }
  .new-album-form { display: none; gap: 10px; flex-direction: column; margin-bottom: 16px; padding: 16px; background: #202020; border-radius: 8px; }
  .new-album-form.show { display: flex; }
  .new-album-form input[type=text] { width: 100%; }
  .file-label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); background: #2a2a2a; padding: 9px 14px; border-radius: 6px; cursor: pointer; border: 1px solid #3a3a3a; }
  .file-label:hover { border-color: var(--accent); color: #fff; }
  .dropzone { border: 2px dashed #3d3d3d; border-radius: 12px; padding: 46px 20px; text-align: center; cursor: pointer; transition: .2s; margin-bottom: 18px; }
  .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: rgba(29,185,84,.06); }
  .dropzone .dz-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .pending-item { background: #202020; border-radius: 8px; padding: 14px; margin-bottom: 10px; border: 1px solid #2e2e2e; }
  .pi-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .pi-name { font-size: 13px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pi-remove { color: var(--muted); font-size: 16px; width: 28px; height: 28px; border-radius: 50%; }
  .pi-remove:hover { background: #3a3a3a; color: #fff; }
  .pi-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .pi-fields input { width: 100%; }
  details summary { cursor: pointer; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 0; user-select: none; }
  details summary:hover { color: #fff; }
  details[open] summary { color: var(--accent); }

  .player { grid-row: 2; grid-column: 1 / -1; background: #000; border-top: 1px solid #1a1a1a; display: flex; align-items: center; padding: 0 18px; gap: 18px; }
  .p-left { display: flex; align-items: center; gap: 12px; width: 30%; min-width: 190px; }
  .p-cover { width: 56px; height: 56px; border-radius: 6px; flex-shrink: 0; display: grid; place-items: center; font-size: 17px; font-weight: 800; overflow: hidden; background: #222; }
  .p-cover img { width: 100%; height: 100%; object-fit: cover; }
  .p-info { min-width: 0; }
  .p-title { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p-artist { font-size: 11.5px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p-center { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 640px; margin: 0 auto; }
  .p-controls { display: flex; align-items: center; gap: 16px; }
  .icon-btn { color: var(--muted); display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; transition: .15s; }
  .icon-btn:hover { color: #fff; }
  .icon-btn.on { color: var(--accent); }
  .play-btn { width: 40px; height: 40px; border-radius: 50%; background: #fff; color: #000; display: grid; place-items: center; transition: .15s; }
  .play-btn:hover { transform: scale(1.07); }
  .p-progress { display: flex; align-items: center; gap: 10px; width: 100%; }
  .p-progress span { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 34px; text-align: center; }
  .bar { flex: 1; height: 4px; background: #4d4d4d; border-radius: 2px; cursor: pointer; position: relative; }
  .bar:hover { height: 6px; }
  .bar-fill { height: 100%; background: #fff; border-radius: 2px; width: 0%; position: relative; }
  .bar:hover .bar-fill { background: var(--accent); }
  .p-right { display: flex; align-items: center; gap: 10px; width: 30%; min-width: 160px; justify-content: flex-end; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 90px; height: 4px; border-radius: 2px; background: #4d4d4d; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border: none; border-radius: 50%; background: #fff; cursor: pointer; }

  .lyrics-panel { position: fixed; top: 0; right: 0; bottom: 92px; width: 340px; background: #0b0b0b; border-left: 1px solid #222; z-index: 60; transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1); display: flex; flex-direction: column; }
  .lyrics-panel.open { transform: none; }
  .lyrics-head { display: flex; align-items: center; justify-content: space-between; padding: 20px; border-bottom: 1px solid #1e1e1e; }
  .lyrics-head h3 { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 10px; }
  .lyrics-body { padding: 22px 20px; overflow-y: auto; flex: 1; white-space: pre-wrap; font-size: 14px; line-height: 1.85; color: #d0d0d0; }
  .lyrics-body.empty-text { color: #666; font-style: italic; white-space: normal; text-align: center; padding-top: 60px; }

  .lyric-line { padding: 8px 12px; border-radius: 4px; transition: .2s; cursor: pointer; line-height: 1.6; }
  .lyric-line:hover { background: #1e1e1e; }
  .lyric-line.active { color: var(--accent); font-weight: 700; font-size: 16px; background: rgba(29,185,84,.08); }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal-bg.show { display: flex; }
  .modal { background: #1e1e1e; border-radius: 12px; padding: 24px; width: 100%; max-width: 520px; box-shadow: 0 20px 60px rgba(0,0,0,.8); max-height: 85vh; display: flex; flex-direction: column; }
  .modal h3 { margin-bottom: 16px; font-size: 18px; flex-shrink: 0; }
  .modal > #modalBody { overflow-y: auto; flex: 1; min-height: 0; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-shrink: 0; }

  .modal-list { display: flex; flex-direction: column; gap: 4px; }
  .modal-list-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 8px; text-align: left; width: 100%; transition: .15s; }
  .modal-list-item:hover:not(:disabled) { background: #2a2a2a; }
  .modal-list-item:disabled { opacity: .5; cursor: not-allowed; }
  .mli-cover { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; font-size: 14px; font-weight: 700; overflow: hidden; }
  .mli-cover img { width: 100%; height: 100%; object-fit: cover; }
  .mli-info { min-width: 0; flex: 1; }
  .mli-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mli-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .ctx-menu { position: fixed; background: #282828; border-radius: 6px; padding: 6px; z-index: 200; box-shadow: 0 10px 30px rgba(0,0,0,.7); min-width: 200px; }
  .ctx-menu button { display: block; width: 100%; text-align: left; padding: 10px 14px; font-size: 13px; border-radius: 4px; color: #e0e0e0; }
  .ctx-menu button:hover { background: #3e3e3e; color: #fff; }
  .ctx-menu button.danger:hover { background: #5a1f1f; color: #ff8a8a; }

  .toast { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--accent); color: #000; padding: 12px 24px; border-radius: 6px; font-weight: 700; font-size: 14px; opacity: 0; pointer-events: none; transition: .3s; z-index: 300; text-align: center; max-width: 90vw; }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  .mobile-header { display: none; }
  .sidebar-overlay { display: none; }

  @media (max-width: 768px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; height: 100vh; height: 100dvh; }
    .mobile-header { display: flex; grid-row: 1; grid-column: 1; align-items: center; justify-content: space-between; padding: 10px 14px; background: #000; border-bottom: 1px solid #1a1a1a; z-index: 50; }
    .mobile-logo { font-size: 17px; font-weight: 700; display: flex; align-items: center; }
    .mobile-logo .mini-dot { display: inline-grid; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #000; place-items: center; font-size: 13px; margin-right: 8px; }
    .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; max-width: 82vw; z-index: 90; transform: translateX(-100%); transition: transform .25s cubic-bezier(.4,0,.2,1); box-shadow: 4px 0 24px rgba(0,0,0,.7); grid-row: auto; grid-column: auto; padding-top: 18px; }
    .sidebar.open { transform: none; }
    .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 85; display: none; }
    .sidebar-overlay.show { display: block; }
    .main { grid-row: 2; grid-column: 1; background: linear-gradient(180deg, #1c1c1c 0%, #121212 220px); }
    .player { grid-row: 3; grid-column: 1; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto auto; grid-template-areas: "cover info controls lyrics" "progress progress progress progress"; gap: 6px 8px; padding: 8px 12px 10px; height: auto; align-items: center; }
    .p-left, .p-center { display: contents; }
    .p-cover { grid-area: cover; width: 44px; height: 44px; font-size: 13px; }
    .p-cover img { border-radius: 4px; }
    .p-info { grid-area: info; min-width: 0; }
    .p-title { font-size: 13px; }
    .p-artist { font-size: 11px; margin-top: 2px; }
    .p-controls { grid-area: controls; gap: 0; }
    .p-controls > #shuffleBtn, .p-controls > #repeatBtn { display: none; }
    .p-right { grid-area: lyrics; width: auto; min-width: 0; gap: 0; justify-content: flex-end; }
    .p-right > svg, .p-right > input[type=range] { display: none; }
    .p-progress { grid-area: progress; gap: 6px; width: 100%; }
    .p-progress span { font-size: 10px; min-width: 26px; }
    .icon-btn { width: 30px; height: 30px; }
    .play-btn { width: 38px; height: 38px; }
    .page { padding: 16px 14px 40px; }
    h1 { font-size: 24px; margin-bottom: 16px; }
    h2 { font-size: 18px; margin: 22px 0 12px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 12px; }
    .card-item { padding: 10px; }
    .card-title { font-size: 13px; }
    .card-sub { font-size: 11px; }
    .track-row { grid-template-columns: 22px 40px 1fr 40px 26px; gap: 8px; padding: 6px 8px; }
    .tr-album, .tr-lyrics { display: none; }
    .tr-menu { opacity: 1; }
    .tr-cover { width: 40px; height: 40px; }
    .tr-title { font-size: 13px; }
    .tr-artist { font-size: 11px; }
    .tr-dur { font-size: 12px; }
    .album-header { flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 14px 0 22px; }
    .album-header .big-cover { width: 160px; height: 160px; font-size: 52px; }
    .album-header h1 { font-size: 26px; }
    .card-box { padding: 16px; }
    .field-row { flex-direction: column; align-items: stretch; }
    .field-row label { min-width: 0; }
    .pi-fields { grid-template-columns: 1fr; }
    .dropzone { padding: 30px 16px; }
    .dz-title { font-size: 15px; }
    input[type=text], input[type=search], select, textarea { font-size: 16px; }
    .lyrics-panel { top: 0; bottom: 0; width: 100%; border-left: none; z-index: 120; }
    .modal { max-width: none; margin: 10px; padding: 18px; }
    .toast { bottom: 130px; font-size: 13px; padding: 10px 18px; }
  }

  /* FULL PLAYER */
  .full-player { position: fixed; inset: 0; z-index: 95; background: linear-gradient(180deg, #2a2a2a 0%, #121212 60%); display: flex; flex-direction: column; padding: 12px 20px calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateY(100%); transition: transform .3s cubic-bezier(.4,0,.2,1); overflow: hidden; }
  .full-player.open { transform: none; }
  .fp-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-shrink: 0; }
  .fp-header-title { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
  .fp-cover { width: min(320px, 45vh); aspect-ratio: 1; margin: 0 auto 20px; border-radius: 10px; overflow: hidden; display: grid; place-items: center; font-size: 60px; font-weight: 800; color: rgba(255,255,255,.9); box-shadow: 0 12px 40px rgba(0,0,0,.6); flex-shrink: 0; }
  .fp-cover img { width: 100%; height: 100%; object-fit: cover; }
  .fp-info { margin-bottom: 18px; flex-shrink: 0; }
  .fp-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fp-artist { font-size: 15px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fp-progress { margin-bottom: 6px; flex-shrink: 0; }
  .fp-progress .bar { width: 100%; height: 4px; }
  .fp-progress .bar:hover { height: 6px; }
  .fp-times { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .fp-controls { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 8px; padding: 0 4px; flex-shrink: 0; }
  .fp-ctrl { width: 44px; height: 44px; color: var(--muted); }

<script>
/* =====================================================================
   УТИЛИТЫ
   ===================================================================== */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function fmt(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}
function fmtLRC(t) {
  if (!isFinite(t) || t < 0) t = 0;
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60);
  const cs = Math.floor((t % 1) * 100);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
}
function hashHue(str) {
  let h = 0;
  for (const ch of String(str)) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return h;
}
function coverStyle(name) {
  const h = hashHue(name || 'x');
  return `background:linear-gradient(135deg,hsl(${h} 68% 42%),hsl(${(h + 65) % 360} 70% 26%));`;
}
function initials(name) {
  return String(name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || '♪';
}
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* =====================================================================
   CLIPBOARD
   ===================================================================== */
async function copyToClipboard(text) {
  if (!text) return false;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* fallback */ }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.top = '-9999px';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  return ok;
}

function buildLRC(track) {
  if (!track) return '';
  if (track.lyricsSynced && track.lyricsSynced.length) {
    return track.lyricsSynced.map(l => `[${fmtLRC(l.t)}] ${l.text}`).join('\n');
  }
  return track.lyrics || '';
}

async function copyCurrentLyrics() {
  const t = state.currentTrack;
  if (!t) { toast('Нет активного трека'); return; }
  const text = buildLRC(t);
  if (!text.trim()) { toast('У трека нет текста'); return; }
  const ok = await copyToClipboard(text);
  if (ok) {
    toast(t.lyricsSynced?.length
      ? `LRC скопирован (${t.lyricsSynced.length} строк)`
      : 'Текст скопирован');
  } else {
    toast('Не удалось скопировать');
  }
}

/* =====================================================================
   LRC PARSER
   ===================================================================== */
function parseLRC(text) {
  const lines = String(text).split(/\r?\n/);
  const result = [];
  const timeRe = /^\[(\d{1,2}):(\d{2})(?:[.:](\d{2,3}))?\]\s*(.*)$/;
  for (const line of lines) {
    const m = line.match(timeRe);
    if (m) {
      const min = parseInt(m[1], 10);
      const sec = parseInt(m[2], 10);
      const frac = m[3] ? parseInt(m[3].padEnd(3, '0'), 10) / 1000 : 0;
      const t = min * 60 + sec + frac;
      const text = m[4].trim();
      if (text) result.push({ t, text });
    }
  }
  return result.sort((a, b) => a.t - b.t);
}
function hasLRCFormat(text) {
  return /\[\d{1,2}:\d{2}(?:[.:]\d{2,3})?\]/.test(String(text || ''));
}

/* =====================================================================
   LRCLIB
   ===================================================================== */
async function fetchLyricsFromLRCLIB(track) {
  const cleanTitle = String(track.title || '').replace(/\(.*?\)|\[.*?\]/g, '').trim();
  const artist = String(track.artist || '').replace(/\(.*?\)|\[.*?\]/g, '').trim();
  const album = albumById(track.albumId)?.title || '';
  const duration = Math.round(track.duration || 0);
  const headers = { 'X-User-Agent': 'SpotifyClone/1.0' };

  if (cleanTitle && artist && duration) {
    const params = new URLSearchParams({
      track_name: cleanTitle,
      artist_name: artist,
      duration: String(duration)
    });
    if (album) params.set('album_name', album);
    try {
      const r = await fetch(`https://lrclib.net/api/get?${params}`, { headers });
      if (r.ok) {
        const data = await r.json();
        if (data.syncedLyrics) return { synced: data.syncedLyrics, plain: data.plainLyrics };
        if (data.plainLyrics) return { synced: null, plain: data.plainLyrics };
      }
    } catch (e) { /* ignore */ }
  }

  if (cleanTitle) {
    const q = [cleanTitle, artist].filter(Boolean).join(' ');
    try {
      const r = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(q)}`, { headers });
      if (r.ok) {
        const arr = await r.json();
        if (Array.isArray(arr) && arr.length) {
          let best = null, bestDiff = Infinity;
          for (const item of arr) {
            const d = Math.abs((item.duration || 0) - duration);
            if (d < bestDiff) { bestDiff = d; best = item; }
          }
          if (best?.syncedLyrics) return { synced: best.syncedLyrics, plain: best.plainLyrics };
          if (best?.plainLyrics) return { synced: null, plain: best.plainLyrics };
        }
      }
    } catch (e) { /* ignore */ }
  }
  return null;
}

/* =====================================================================
   INDEXEDDB
   ===================================================================== */
const DB_NAME = 'spotify-clone-db';
const DB_VER  = 2;
let db = null;

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('tracks')) {
        const s = d.createObjectStore('tracks', { keyPath: 'id' });
        s.createIndex('albumId', 'albumId');
      }
      if (!d.objectStoreNames.contains('albums')) d.createObjectStore('albums', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('playlists')) d.createObjectStore('playlists', { keyPath: 'id' });
    };
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror = e => rej(e.target.error);
  });
}
function dbGetAll(store) {
  return new Promise((res, rej) => {
    const r = db.transaction(store).objectStore(store).getAll();
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function dbPut(store, val) {
  return new Promise((res, rej) => {
    const r = db.transaction(store, 'readwrite').objectStore(store).put(val);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function dbDelete(store, key) {
  return new Promise((res, rej) => {
    const r = db.transaction(store, 'readwrite').objectStore(store).delete(key);
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
}

/* =====================================================================
   СОСТОЯНИЕ
   ===================================================================== */
let albums = [];
let tracks = [];
let playlists = [];
let pendingFiles = [];
let listRegistry = {};
const urlCache = new Map();

const audio = $('#audio');
const state = {
  queue: [], index: -1, currentTrack: null,
  isPlaying: false, shuffle: false, repeat: 'off'
};

/* =====================================================================
   ХЕЛПЕРЫ
   ===================================================================== */
function coverURL(album) {
  if (!album || !album.cover) return null;
  const key = 'cover_' + album.id;
  if (!urlCache.has(key)) urlCache.set(key, URL.createObjectURL(album.cover));
  return urlCache.get(key);
}
function trackURL(track) {
  if (!urlCache.has(track.id)) urlCache.set(track.id, URL.createObjectURL(track.blob));
  return urlCache.get(track.id);
}
function albumById(id) { return albums.find(a => a.id === id) || null; }
function playlistById(id) { return playlists.find(p => p.id === id) || null; }
function tracksOfAlbum(id) {
  return tracks.filter(t => t.albumId === id).sort((a, b) => (a.order || 0) - (b.order || 0) || a.addedAt - b.addedAt);
}
function playlistTracks(pl) {
  if (!pl) return [];
  return pl.trackIds.map(id => tracks.find(t => t.id === id)).filter(Boolean);
}
function playlistCover(pl) {
  const first = playlistTracks(pl)[0];
  return first ? coverURL(albumById(first.albumId)) : null;
}
async function reloadData() {
  albums = await dbGetAll('albums');
  tracks = await dbGetAll('tracks');
  playlists = await dbGetAll('playlists');
  albums.sort((a, b) => b.createdAt - a.createdAt);
  playlists.sort((a, b) => b.createdAt - a.createdAt);
  renderSidebarAlbums();
  renderSidebarPlaylists();
}

/* =====================================================================

let currentView = { name: 'home', param: null };
function navigate(name, param = null) {
  currentView = { name, param };
  renderMain();
  $$('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === name));
  if (window.innerWidth <= 768) closeSidebar();
}
function renderMain() {
  listRegistry = {};
  const v = currentView;
  if (v.name === 'home') renderHome();
  else if (v.name === 'upload') renderUpload();
  else if (v.name === 'album') renderAlbum(v.param);
  else if (v.name === 'playlist') renderPlaylist(v.param);
  else if (v.name === 'search') renderSearch();
}

function trackRowsHTML(list, listName, opts = {}) {
  listRegistry[listName] = list;
  if (!list.length) return `<div class="empty">${opts.emptyText || 'Здесь пока нет треков'}</div>`;
  return `<div class="track-list">` + list.map((t, i) => {
    const al = albumById(t.albumId);
    const url = coverURL(al);
    const cover = url
      ? `<div class="tr-cover"><img src="${url}" alt=""></div>`
      : `<div class="tr-cover" style="${coverStyle(t.title)}">${esc(initials(t.title))}</div>`;
    const isPlaying = state.currentTrack && state.currentTrack.id === t.id;
    const hasLyrics = t.lyricsSynced?.length || (t.lyrics && t.lyrics.trim());
    return `<div class="track-row ${isPlaying ? 'playing' : ''}" data-list="${listName}" data-i="${i}" data-id="${t.id}">
      <div class="tr-index">
        <span class="num">${i + 1}</span>
        <span class="play"><svg viewBox="0 0 24 24" width="14" height="14" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span>
      </div>
      ${cover}
      <div class="tr-main">
        <div class="tr-title">${esc(t.title)}</div>
        <div class="tr-artist">${esc(t.artist || al?.artist || 'Неизвестный исполнитель')}</div>
      </div>
      ${opts.showAlbum ? `<div class="tr-album">${esc(al ? al.title : '—')}</div>` : `<div class="tr-album"></div>`}
      <div class="tr-lyrics">${hasLyrics ? 'TXT' : ''}</div>
      <div class="tr-dur">${fmt(t.duration)}</div>
      <button class="tr-menu" data-menu="${t.id}">⋯</button>
    </div>`;
  }).join('') + `</div>`;
}

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

  const sel = $('#albumSelect'), form = $('#newAlbumForm');

  syncForm();

  });

  const dz = $('#dropzone'), fi = $('#fileInput');
  dz.addEventListener('click', () => fi.click());

  ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('drag'); }));

  $('#uploadBtn').addEventListener('click', doUpload);
  renderPending();

function renderPending() {
  const el = $('#pendingList'), btn = $('#uploadBtn');
  if (!el) return;
  if (!pendingFiles.length) {
    el.innerHTML = '';
    if (btn) { btn.disabled = true; btn.textContent = 'Загрузить'; }
    const st = $('#uploadStatus'); if (st) st.textContent = '';
    return;
  }
  if (btn) btn.disabled = false;
  el.innerHTML = pendingFiles.map((p, i) => `
    <div class="pending-item" data-i="${i}">
      <div class="pi-head">
        <span class="pi-name">🎵 ${esc(p.file.name)}</span>
        <span class="muted">${p.duration ? fmt(p.duration) : '…'}</span>
        <button class="pi-remove" data-remove="${i}">✕</button>
      </div>
      <div class="pi-fields">
        <input type="text" data-f="title" value="${esc(p.title)}" placeholder="Название">
        <input type="text" data-f="artist" value="${esc(p.artist)}" placeholder="Исполнитель">
      </div>
      <details>
        <summary>📝 Текст песни ${p.lyrics ? '(заполнено)' : ''}</summary>
        <textarea data-f="lyrics" placeholder="Вставьте текст (можно LRC с [mm:ss.xx])">${esc(p.lyrics)}</textarea>
      </details>
    </div>
  `).join('');
  const st = $('#uploadStatus');
  if (st) st.textContent = `Выбрано файлов: ${pendingFiles.length}`;
}

const AUDIO_EXT = /\.(mp3|wav|ogg|oga|flac|m4a|aac|opus|weba|aiff|aif|wma)$/i;
async function addFiles(fileList) {
  const files = [...fileList].filter(f => f.type.startsWith('audio/') || AUDIO_EXT.test(f.name));
  if (!files.length) { toast('Аудиофайлы не найдены'); return; }
  const batch = files.map(f => ({
    id: uid(), file: f, title: f.name.replace(/\.[^.]+$/, ''),
    artist: '', lyrics: '', duration: 0
  }));
  pendingFiles.push(...batch);
  renderPending();
  for (const p of batch) { p.duration = await getDuration(p.file); renderPending(); }
}
function getDuration(file) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(file);
    const a = new Audio();
    a.preload = 'metadata';
    const done = d => { URL.revokeObjectURL(url); resolve(isFinite(d) ? d : 0); };
    a.onloadedmetadata = () => done(a.duration);
    a.onerror = () => done(0);
    setTimeout(() => done(a.duration || 0), 8000);
    a.src = url;
  });
}
async function doUpload() {
  if (!pendingFiles.length) return;
  const sel = $('#albumSelect'), btn = $('#uploadBtn'), status = $('#uploadStatus');
  btn.disabled = true; btn.textContent = 'Загрузка...';
  let albumId = sel.value;

  if (albumId === '__new') {
    const title = $('#newAlbumTitle').value.trim();
    if (!title) { toast('Введите название альбома'); btn.disabled = false; btn.textContent = 'Загрузить'; return; }
    const album = {
      id: uid(), title,
      artist: $('#newAlbumArtist').value.trim(),
      cover: $('#newAlbumCover').files[0] || null,
      createdAt: Date.now()
    };
    await dbPut('albums', album);
    albumId = album.id;
  } else if (albumId === '') {
    albumId = null;
  }

  const al = albumById(albumId);
  let order = tracksOfAlbum(albumId).length;
  let done = 0;

  for (const p of pendingFiles) {
    const lyricsVal = p.lyrics || '';
    const track = {
      id: p.id,
      title: p.title.trim() || p.file.name.replace(/\.[^.]+$/, ''),
      artist: p.artist.trim() || (al ? al.artist : '') || 'Неизвестный исполнитель',
      albumId,
      blob: p.file,
      mime: p.file.type || 'audio/mpeg',
      duration: p.duration || 0,
      lyrics: lyricsVal,
      lyricsSynced: hasLRCFormat(lyricsVal) ? parseLRC(lyricsVal) : null,
      addedAt: Date.now(),
      order: order++
    };
    await dbPut('tracks', track);
    done++;
    if (status) status.textContent = `Загружено ${done} из ${pendingFiles.length}...`;
  }
  pendingFiles = [];
  await reloadData();
  toast(`Загружено треков: ${done}`);
  navigate(albumId ? 'album' : 'home', albumId);
}

/* =====================================================================
   ПЛЕЕР
   ===================================================================== */
function playFromList(list, index) {
  if (!list || !list.length) return;
  state.queue = [...list];
  state.index = index;
  loadCurrent();
}
function loadCurrent(autoplay = true) {
  const t = state.queue[state.index];
  if (!t) return;
  state.currentTrack = t;
  audio.src = trackURL(t);
  audio.currentTime = 0;
  if (autoplay) {
    audio.play().then(() => { state.isPlaying = true; updatePlayerUI(); })
                .catch(() => { state.isPlaying = false; updatePlayerUI(); });
  }
  updatePlayerUI();
  updateLyricsPanel();
  refreshPlayingHighlight();
}
function togglePlay() {
  if (!state.currentTrack) {
    const all = [...tracks].sort((a, b) => b.addedAt - a.addedAt);
    if (all.length) playFromList(all, 0);
    return;
  }
  if (audio.paused) {
    audio.play().then(() => { state.isPlaying = true; updatePlayerUI(); });
  } else {
    audio.pause();
    state.isPlaying = false;
    updatePlayerUI();
  }
}
function nextTrack(user = true) {
  if (!state.queue.length) return;
  if (state.shuffle && state.queue.length > 1) {
    let n;
    do { n = Math.floor(Math.random() * state.queue.length); } while (n === state.index);
    state.index = n; loadCurrent(); return;
  }
  if (state.index < state.queue.length - 1) { state.index++; loadCurrent(); }
  else if (state.repeat === 'all') { state.index = 0; loadCurrent(); }
  else if (!user) { state.isPlaying = false; updatePlayerUI(); }
}
function prevTrack() {
  if (!state.queue.length) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  if (state.index > 0) { state.index--; loadCurrent(); }
  else { audio.currentTime = 0; }
}
function updatePlayerUI() {
  const t = state.currentTrack;
  if (t) {
    const al = albumById(t.albumId);
    const url = coverURL(al);
    const cover = $('#pCover');
    if (url) { cover.style.cssText = ''; cover.innerHTML = `<img src="${url}" alt="">`; }
    else { cover.style.cssText = coverStyle(t.title); cover.innerHTML = `<span>${esc(initials(t.title))}</span>`; }
    $('#pTitle').textContent = t.title;
    $('#pArtist').textContent = t.artist || 'Неизвестный исполнитель';
    $('#durTime').textContent = fmt(audio.duration || t.duration);
  } else {
    $('#pCover').style.cssText = ''; $('#pCover').innerHTML = '';
    $('#pTitle').textContent = 'Ничего не воспроизводится';
    $('#pArtist').textContent = '—';
    $('#durTime').textContent = '0:00'; $('#curTime').textContent = '0:00';
    $('#seekFill').style.width = '0%';
  }
  $('#playBtn').innerHTML = state.isPlaying
    ? `<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>`
    : `<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
  $('#shuffleBtn').classList.toggle('on', state.shuffle);
  $('#repeatBtn').classList.toggle('on', state.repeat !== 'off');
  $('#repeatBtn').title = 'Повтор: ' + ({ off: 'выкл', all: 'все', one: 'один трек' })[state.repeat];
}
function refreshPlayingHighlight() {
  $$('.track-row').forEach(row => {
    row.classList.toggle('playing', !!state.currentTrack && row.dataset.id === state.currentTrack.id);
  });
}

/* =====================================================================
   ЛИРИКА: ОТОБРАЖЕНИЕ
   ===================================================================== */
let lyricsUserScrolled = false;
let lyricsAutoScrollTimer = null;

function updateLyricsPanel() {
  const t = state.currentTrack;
  const body = $('#lyricsBody');
  const titleEl = $('#lyricsTitle');

  if (!t) {
    titleEl.textContent = 'Текст песни';
    body.className = 'lyrics-body empty-text';
    body.textContent = 'Ничего не воспроизводится';
    body.dataset.trackId = '';
    body.onclick = null; body.onscroll = null;
    return;
  }

  titleEl.textContent = t.title;

  const key = t.id + ':' + (t.lyricsSynced?.length || 0) + ':' + (t.lyrics?.length || 0);
  if (body.dataset.trackId === key) return;
  body.dataset.trackId = key;

  if (t.lyricsSynced && t.lyricsSynced.length) {
    body.className = 'lyrics-body';
    body.innerHTML = t.lyricsSynced.map((l, i) =>
      `<div class="lyric-line" data-i="${i}" data-t="${l.t}">${esc(l.text)}</div>`
    ).join('');
    body.onclick = (e) => {
      const line = e.target.closest('.lyric-line');
      if (line) audio.currentTime = parseFloat(line.dataset.t);
    };
    body.onscroll = () => {
      lyricsUserScrolled = true;
      clearTimeout(lyricsAutoScrollTimer);
      lyricsAutoScrollTimer = setTimeout(() => { lyricsUserScrolled = false; }, 5000);
    };
    updateLyricsHighlight();
  } else if (t.lyrics && t.lyrics.trim()) {
    body.className = 'lyrics-body';
    body.textContent = t.lyrics;
    body.onclick = null; body.onscroll = null;
  } else {
    body.className = 'lyrics-body empty-text';
    body.textContent = 'Для этого трека текст не добавлен.\n\nВы можете добавить его через меню ⋯ у трека.';
    body.onclick = null; body.onscroll = null;
  }
}
function updateLyricsHighlight() {
  const body = $('#lyricsBody');
  if (!body) return;
  const lines = body.querySelectorAll('.lyric-line');
  if (!lines.length) return;
  const t = state.currentTrack;
  if (!t || !t.lyricsSynced) return;
  const cur = audio.currentTime;
  let activeIdx = -1;
  for (let i = 0; i < t.lyricsSynced.length; i++) {
    if (t.lyricsSynced[i].t <= cur) activeIdx = i;
    else break;
  }
  lines.forEach((el, i) => el.classList.toggle('active', i === activeIdx));
  if (activeIdx >= 0 && !lyricsUserScrolled) {
    lines[activeIdx].scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
}

/* =====================================================================
   СОБЫТИЯ AUDIO
   ===================================================================== */
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  $('#curTime').textContent = fmt(audio.currentTime);
  $('#durTime').textContent = fmt(audio.duration);
  $('#seekFill').style.width = (audio.currentTime / audio.duration * 100) + '%';
  updateLyricsHighlight();
});
audio.addEventListener('loadedmetadata', () => { $('#durTime').textContent = fmt(audio.duration); });
audio.addEventListener('play',  () => { state.isPlaying = true;  updatePlayerUI(); });
audio.addEventListener('pause', () => { state.isPlaying = false; updatePlayerUI(); });
audio.addEventListener('ended', () => {
  if (state.repeat === 'one') { audio.currentTime = 0; audio.play(); return; }
  nextTrack(false);
});
audio.addEventListener('error', () => { if (state.currentTrack) toast('Не удалось воспроизвести файл'); });

$('#playBtn').addEventListener('click', togglePlay);
$('#nextBtn').addEventListener('click', () => nextTrack(true));
$('#prevBtn').addEventListener('click', prevTrack);
$('#shuffleBtn').addEventListener('click', () => { state.shuffle = !state.shuffle; updatePlayerUI(); });
$('#repeatBtn').addEventListener('click', () => {
  state.repeat = state.repeat === 'off' ? 'all' : state.repeat === 'all' ? 'one' : 'off';
  updatePlayerUI();
});
$('#seekBar').addEventListener('click', e => {
  if (!audio.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
});
$('#volume').addEventListener('input', e => { audio.volume = +e.target.value; });
$('#lyricsBtn').addEventListener('click', () => {
  $('#lyricsPanel').classList.toggle('open');
  $('#lyricsBtn').classList.toggle('on', $('#lyricsPanel').classList.contains('open'));
});
$('#lyricsClose').addEventListener('click', () => {
  $('#lyricsPanel').classList.remove('open');
  $('#lyricsBtn').classList.remove('on');
});
$('#lyricsCopy').addEventListener('click', copyCurrentLyrics);

/* =====================================================================
   ГЛОБАЛЬНЫЕ КЛИКИ
   ===================================================================== */
document.addEventListener('click', e => {
  const nav = e.target.closest('.nav-item');
  if (nav) { navigate(nav.dataset.view); return; }

  const sideAl = e.target.closest('.side-album');
  if (sideAl) {
    if (sideAl.dataset.album) navigate('album', sideAl.dataset.album);
    else if (sideAl.dataset.playlist) navigate('playlist', sideAl.dataset.playlist);
    return;
  }

  const playAlbum = e.target.closest('[data-playalbum]');
  if (playAlbum) {
    e.stopPropagation();
    const list = tracksOfAlbum(playAlbum.dataset.playalbum);
    if (list.length) playFromList(list, 0); else toast('В альбоме нет треков');
    return;
  }
  const playPl = e.target.closest('[data-playplaylist]');
  if (playPl) {
    e.stopPropagation();
    const pl = playlistById(playPl.dataset.playplaylist);
    const list = playlistTracks(pl);
    if (list.length) playFromList(list, 0); else toast('Плейлист пуст');
    return;
  }

  const card = e.target.closest('.card-item[data-album]');
  if (card) { navigate('album', card.dataset.album); return; }
  const cardPl = e.target.closest('.card-item[data-playlist]');
  if (cardPl) { navigate('playlist', cardPl.dataset.playlist); return; }

  const menuBtn = e.target.closest('[data-menu]');
  if (menuBtn) {
    e.stopPropagation();
    const id = menuBtn.dataset.menu;
    const track = tracks.find(t => t.id === id);
    if (!track) return;
    let playlistId = null;
    if (currentView.name === 'playlist' && currentView.param) {
      const pl = playlistById(currentView.param);
      if (pl && pl.trackIds.includes(track.id)) playlistId = pl.id;
    }
    openTrackMenu(menuBtn.getBoundingClientRect(), track, playlistId);
    return;
  }

  const row = e.target.closest('.track-row');
  if (row) {
    const list = listRegistry[row.dataset.list];
    const i = +row.dataset.i;
    if (list && list[i]) {
      if (state.currentTrack && state.currentTrack.id === list[i].id) togglePlay();
      else playFromList(list, i);
    }
    return;
  }

  closeCtxMenu();
});

/* =====================================================================
   КОНТЕКСТНОЕ МЕНЮ
   ===================================================================== */
function closeCtxMenu() { document.querySelectorAll('.ctx-menu').forEach(m => m.remove()); }
function openTrackMenu(rect, track, playlistId = null) {
  closeCtxMenu();
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';

  const lyricsLabel = track.lyricsSynced?.length
    ? '⏱ Редактировать синхронизацию'
    : (track.lyrics ? '🎯 Синхронизировать текст' : '📝 Добавить текст');

  let html = `
    <button data-act="play">▶ Воспроизвести</button>
    <button data-act="addto">➕ В плейлист...</button>
    <button data-act="lyrics">${lyricsLabel}</button>
    <button data-act="rename">✏️ Переименовать</button>
  `;
  if (playlistId) html += `<button data-act="rmplaylist" class="danger">✕ Убрать из плейлиста</button>`;
  html += `<button data-act="delete" class="danger">🗑 Удалить трек</button>`;
  menu.innerHTML = html;
  document.body.appendChild(menu);

  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let x = rect.left, y = rect.bottom + 6;
  if (x + mw > innerWidth - 10) x = innerWidth - mw - 10;
  if (y + mh > innerHeight - 10) y = rect.top - mh - 6;
  menu.style.left = Math.max(10, x) + 'px';
  menu.style.top = Math.max(10, y) + 'px';

  menu.addEventListener('click', async e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (!act) return;
    closeCtxMenu();

    if (act === 'play') playFromList([track], 0);
    else if (act === 'addto') openAddToPlaylistModal(track.id);
    else if (act === 'rmplaylist' && playlistId) {
      const pl = playlistById(playlistId);
      if (!pl) return;
      pl.trackIds = pl.trackIds.filter(id => id !== track.id);
      await dbPut('playlists', pl);
      await reloadData();
      renderMain();
      toast('Убрано из плейлиста');
    }
    else if (act === 'lyrics') openLyricsModal(track);
    else if (act === 'rename') {
      openModal('Переименовать трек', `
        <input type="text" id="mTitle" value="${esc(track.title)}" style="width:100%;margin-bottom:10px" placeholder="Название">
        <input type="text" id="mArtist" value="${esc(track.artist || '')}" style="width:100%" placeholder="Исполнитель">
      `, async () => {
        track.title = $('#mTitle').value.trim() || track.title;
        track.artist = $('#mArtist').value.trim();
        await dbPut('tracks', track);
        await reloadData();
        renderMain();
        if (state.currentTrack?.id === track.id) {
          state.currentTrack = track;
          updatePlayerUI();
        }
        toast('Сохранено');
      });
    }
    else if (act === 'delete') {
      if (!confirm(`Удалить трек «${track.title}»?`)) return;
      await dbDelete('tracks', track.id);
      urlCache.delete(track.id);
      for (const pl of playlists) {
        if (pl.trackIds.includes(track.id)) {
          pl.trackIds = pl.trackIds.filter(id => id !== track.id);
          await dbPut('playlists', pl);
        }
      }
      await reloadData();
      if (state.currentTrack?.id === track.id) {
        audio.pause(); audio.removeAttribute('src'); audio.load();
        state.currentTrack = null; state.queue = []; state.index = -1;
        state.isPlaying = false;
        updatePlayerUI(); updateLyricsPanel();
      }
      renderMain();
      toast('Трек удалён');
    }
  });
}

let modalOkHandler = null;
function openModal(title, bodyHTML, onOk) {
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = bodyHTML;
  $('#modalBg').classList.add('show');
  $('#modalOk').style.display = '';
  $('#modalCancel').textContent = 'Отмена';
  modalOkHandler = onOk;
}
function closeModal() {
  $('#modalBg').classList.remove('show');
  $('#modalOk').style.display = '';
  $('#modalCancel').textContent = 'Отмена';
  $('#modalBody').onclick = null;
  modalOkHandler = null;
}
$('#modalCancel').addEventListener('click', closeModal);
$('#modalOk').addEventListener('click', async () => {
  const fn = modalOkHandler;
  closeModal();
  if (fn) await fn();
});
$('#modalBg').addEventListener('click', e => { if (e.target === $('#modalBg')) closeModal(); });

/* =====================================================================
   МОДАЛКА ЛИРИКИ
   ===================================================================== */
function openLyricsModal(track) {
  const hasSynced = track.lyricsSynced && track.lyricsSynced.length > 0;
  const baseText = hasSynced
    ? track.lyricsSynced.map(l => `[${fmtLRC(l.t)}] ${l.text}`).join('\n')
    : (track.lyrics || '');

  openModal('Текст песни — ' + track.title, `
    <textarea id="mLyrics" placeholder="Вставьте текст. Если есть LRC с [00:12.34] — распознается автоматически." style="min-height:220px">${esc(baseText)}</textarea>
    <div id="lrcHint" style="margin-top:8px;font-size:12px"></div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      ${navigator.onLine ? '<button class="btn ghost small" id="mSearchLyrics">🔍 Найти в интернете</button>' : ''}
      <button class="btn ghost small" id="mTapSync">🎯 Разметить вручную</button>
      <button class="btn ghost small" id="mCopyLRC">📋 Копировать</button>
    </div>
  `, async () => {
    const val = $('#mLyrics').value;
    if (hasLRCFormat(val)) {
      track.lyricsSynced = parseLRC(val);
      track.lyrics = val;
    } else {
      track.lyrics = val;
      track.lyricsSynced = null;
    }
    await dbPut('tracks', track);
    await reloadData();
    if (state.currentTrack?.id === track.id) {
      state.currentTrack = track;
      updateLyricsPanel();
    }
    renderMain();
    toast('Текст сохранён');
  });

  const ta = $('#mLyrics');
  const hint = $('#lrcHint');

  function updateHint() {
    const val = ta.value;
    if (hasLRCFormat(val)) {
      const parsed = parseLRC(val);
      hint.textContent = `✅ Обнаружены LRC-тайминги: ${parsed.length} строк`;
      hint.style.color = 'var(--accent)';
    } else if (val.trim()) {
      hint.textContent = 'Обычный текст. Тайминги не расставлены.';
      hint.style.color = 'var(--muted)';
    } else {
      hint.textContent = '';
    }
  }
  ta.addEventListener('input', updateHint);
  updateHint();

  $('#mSearchLyrics')?.addEventListener('click', async () => {
    const btn = $('#mSearchLyrics');
    btn.disabled = true;
    const orig = btn.textContent;
    btn.textContent = 'Поиск...';
    try {
      const res = await fetchLyricsFromLRCLIB(track);
      if (!res) { toast('Ничего не найдено'); return; }
      if (res.synced) { ta.value = res.synced; updateHint(); toast('Найдены тайминги LRC'); }
      else if (res.plain) { ta.value = res.plain; updateHint(); toast('Найден текст без таймингов'); }
    } catch (e) {
      toast('Ошибка сети');
    } finally {
      btn.disabled = false;
      btn.textContent = orig;
    }
  });

  $('#mTapSync')?.addEventListener('click', () => {
    const text = ta.value;
    if (!text.trim()) { toast('Сначала введите текст'); return; }
    let items;
    if (hasLRCFormat(text)) {
      items = parseLRC(text).map(l => ({ text: l.text, t: l.t }));
    } else {
      items = text.split(/\r?\n/).filter(l => l.trim()).map(l => ({ text: l.trim(), t: null }));
    }
    if (!items.length) { toast('Нет строк для разметки'); return; }
    closeModal();
    openTapSyncEditor(track, items);
  });

  $('#mCopyLRC')?.addEventListener('click', async () => {
    const val = ta.value;
    if (!val.trim()) { toast('Нечего копировать'); return; }
    const ok = await copyToClipboard(val);
    if (ok) {
      toast(hasLRCFormat(val)
        ? `LRC скопирован (${parseLRC(val).length} строк)`
        : 'Текст скопирован');
    } else {
      toast('Не удалось скопировать');
    }
  });
}

/* =====================================================================
   TAP-TO-SYNC
   ===================================================================== */
let tapSync = null;
function openTapSyncEditor(track, items) {
  if (tapSync) closeTapSync();

  const overlay = document.createElement('div');
  overlay.className = 'tap-sync-overlay';
  overlay.innerHTML = `
    <div class="ts-header">
      <button class="icon-btn" id="tsClose">✕</button>
      <div class="ts-title">Разметка текста</div>
      <div class="ts-progress" id="tsProgress">0 / ${items.length}</div>
    </div>
    <div class="ts-list" id="tsList">
      ${items.map((l, i) => `
        <div class="ts-line ${i === 0 ? 'active' : ''} ${l.t != null ? 'done' : ''}" data-i="${i}">
          <span class="ts-time">${l.t != null ? fmtLRC(l.t) : '—'}</span>
          <span class="ts-text">${esc(l.text)}</span>
        </div>
      `).join('')}
    </div>
    <div class="ts-footer">
      <div class="ts-bar"><div class="ts-fill" id="tsFill"></div></div>
      <div class="ts-time-row"><span id="tsCur">0:00</span><span id="tsDur">${fmt(track.duration)}</span></div>
      <div class="ts-actions">
        <button class="btn ghost small" id="tsUndo">↩ Отменить</button>
        <button class="btn accent" id="tsMark">► Отметить</button>
        <button class="btn ghost small" id="tsSave">💾 Сохранить</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const audioEl = new Audio(trackURL(track));
  audioEl.volume = 1;

  tapSync = {
    track,
    items: items.map((l, i) => ({ ...l, idx: i })),
    current: items.findIndex(l => l.t == null) === -1 ? items.length : items.findIndex(l => l.t == null),
    audio: audioEl,
    overlay,
    started: false
  };
  if (tapSync.current === -1) tapSync.current = 0;

  const listEl = overlay.querySelector('#tsList');
  const progressEl = overlay.querySelector('#tsProgress');
  const fillEl = overlay.querySelector('#tsFill');
  const curEl = overlay.querySelector('#tsCur');

  function setActive(idx) {
    listEl.querySelectorAll('.ts-line').forEach(el => el.classList.remove('active'));
    const el = listEl.querySelector(`[data-i="${idx}"]`);
    if (el) { el.classList.add('active'); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    tapSync.current = idx;
    progressEl.textContent = `${Math.min(idx, items.length)} / ${items.length}`;
  }
  function mark() {
    if (tapSync.current >= items.length) return;
    const t = audioEl.currentTime;
    tapSync.items[tapSync.current].t = t;
    const lineEl = listEl.querySelector(`[data-i="${tapSync.current}"]`);
    lineEl.querySelector('.ts-time').textContent = fmtLRC(t);
    lineEl.classList.add('done');
    let next = tapSync.current + 1;
    while (next < items.length && tapSync.items[next].t != null) next++;
    if (next < items.length) setActive(next);
    else { setActive(items.length); toast('Все строки отмечены — нажмите Сохранить'); }
  }
  function undo() {
    let idx = tapSync.current;
    if (idx >= items.length) idx = items.length - 1;
    if (tapSync.items[idx].t == null && idx > 0) idx--;
    const item = tapSync.items[idx];
    if (item.t != null) {
      item.t = null;
      const lineEl = listEl.querySelector(`[data-i="${idx}"]`);
      lineEl.querySelector('.ts-time').textContent = '—';
      lineEl.classList.remove('done');
    }
    setActive(idx);
  }
  function updateProgress() {
    if (!audioEl.duration) return;
    fillEl.style.width = (audioEl.currentTime / audioEl.duration * 100) + '%';
    curEl.textContent = fmt(audioEl.currentTime);
  }
  function togglePlay() {
    if (audioEl.paused) { audioEl.play(); tapSync.started = true; }
    else audioEl.pause();
  }

  overlay.querySelector('#tsClose').onclick = () => {
    if (tapSync.items.some(l => l.t != null) && !confirm('Выйти без сохранения?')) return;
    closeTapSync();
  };
  overlay.querySelector('#tsMark').onclick = () => {
    if (!tapSync.started) togglePlay();
    mark();
  };
  overlay.querySelector('#tsUndo').onclick = undo;
  overlay.querySelector('#tsSave').onclick = async () => {
    if (tapSync.items.some(l => l.t == null)) {
      if (!confirm('Не все строки отмечены. Всё равно сохранить?')) return;
    }
    const synced = tapSync.items
      .filter(l => l.t != null)
      .map(l => ({ t: l.t, text: l.text }))
      .sort((a, b) => a.t - b.t);
    track.lyricsSynced = synced;
    track.lyrics = synced.map(l => `[${fmtLRC(l.t)}] ${l.text}`).join('\n');
    await dbPut('tracks', track);
    await reloadData();
    if (state.currentTrack?.id === track.id) {
      state.currentTrack = track;
      updateLyricsPanel();
    }
    closeTapSync();
    renderMain();
    toast('Синхронизация сохранена');
  };

  audioEl.addEventListener('timeupdate', updateProgress);
  audioEl.addEventListener('ended', () => { fillEl.style.width = '100%'; });
  listEl.addEventListener('click', e => {
    const line = e.target.closest('.ts-line');
    if (!line) return;
    const i = +line.dataset.i;
    const item = tapSync.items[i];
    if (item.t != null) { audioEl.currentTime = item.t; setActive(i); }
  });

  const keyHandler = (e) => {
    if (e.code === 'Space') { e.preventDefault(); overlay.querySelector('#tsMark').click(); }
    if (e.code === 'Escape') overlay.querySelector('#tsClose').click();
  };
  document.addEventListener('keydown', keyHandler);
  tapSync.keyHandler = keyHandler;

  setActive(tapSync.current);
}
function closeTapSync() {
  if (!tapSync) return;
  document.removeEventListener('keydown', tapSync.keyHandler);
  tapSync.audio.pause();
  tapSync.audio.src = '';
  tapSync.overlay.remove();
  tapSync = null;
}

/* =====================================================================
   МОБИЛЬНЫЙ САЙДБАР
   ===================================================================== */
function closeSidebar() {
  $('#sidebar')?.classList.remove('open');
  $('#sidebarOverlay')?.classList.remove('show');
}
function openSidebar() {
  $('#sidebar')?.classList.add('open');
  $('#sidebarOverlay')?.classList.add('show');
}
$('#menuBtn')?.addEventListener('click', openSidebar);
$('#sidebarOverlay')?.addEventListener('click', closeSidebar);
$('#mobileUploadBtn')?.addEventListener('click', () => { navigate('upload'); });
document.querySelector('.sidebar')?.addEventListener('click', e => {
  if (window.innerWidth <= 768 && e.target.closest('button')) setTimeout(closeSidebar, 120);
});
window.addEventListener('resize', () => { if (window.innerWidth > 768) closeSidebar(); });
$('#newPlaylistBtn')?.addEventListener('click', e => { e.stopPropagation(); openCreatePlaylistModal(); });

/* =====================================================================
   ГОРЯЧИЕ КЛАВИШИ
   ===================================================================== */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight' && e.shiftKey) { e.preventDefault(); nextTrack(true); }
  if (e.code === 'ArrowLeft' && e.shiftKey) { e.preventDefault(); prevTrack(); }
  if (e.code === 'Escape') { closeModal(); closeCtxMenu(); closeSidebar(); }
});

/* =====================================================================
   FULL PLAYER
   ===================================================================== */
let sleepTimer = null;
function updateSleepButton() {
  const label = document.getElementById('fpSleepLabel');
  const btn = document.getElementById('fpSleepBtn');
  if (!label || !btn) return;
  if (!sleepTimer) { label.textContent = 'Таймер'; btn.classList.remove('on'); return; }
  btn.classList.add('on');
  if (sleepTimer.type === 'track') { label.textContent = 'В конце трека'; return; }
  const left = Math.max(0, sleepTimer.endTime - Date.now());
  const m = Math.floor(left / 60000);
  const s = Math.floor((left % 60000) / 1000);
  label.textContent = `${m}:${String(s).padStart(2, '0')}`;
}
function clearSleepTimer() {
  if (sleepTimer) {
    clearTimeout(sleepTimer.timeoutId);
    clearInterval(sleepTimer.intervalId);
    sleepTimer = null;
  }
  updateSleepButton();
}
function setSleepTimer(val) {
  clearSleepTimer();
  if (!val) return;
  if (val === 'track') {
    if (state.repeat === 'one') { state.repeat = 'off'; updatePlayerUI(); }
    sleepTimer = { type: 'track' };
    updateSleepButton();
    toast('Таймер: в конце трека');
    return;
  }
  const ms = val * 60000;
  const timeoutId = setTimeout(() => {
    audio.pause();
    clearSleepTimer();
    toast('Таймер сна: воспроизведение остановлено');
  }, ms);
  const intervalId = setInterval(updateSleepButton, 1000);
  sleepTimer = { type: 'time', endTime: Date.now() + ms, timeoutId, intervalId };
  updateSleepButton();
  toast(`Таймер: ${val} мин`);
}
function syncFullPlayerUI() {
  const cover = document.getElementById('fpCover');
  if (!cover) return;
  const t = state.currentTrack;
  const title = document.getElementById('fpTitle');
  const artist = document.getElementById('fpArtist');
  const playBtn = document.getElementById('fpPlayBtn');
  const durTime = document.getElementById('fpDurTime');
  const shuffleBtn = document.getElementById('fpShuffleBtn');
  const repeatBtn = document.getElementById('fpRepeatBtn');

  if (t) {
    const al = albumById(t.albumId);
    const url = coverURL(al);
    if (url) { cover.style.cssText = ''; cover.innerHTML = `<img src="${url}" alt="">`; }
    else { cover.style.cssText = coverStyle(t.title); cover.innerHTML = `<span>${esc(initials(t.title))}</span>`; }
    title.textContent = t.title;
    artist.textContent = t.artist || 'Неизвестный исполнитель';
    durTime.textContent = fmt(audio.duration || t.duration);
  } else {
    cover.style.cssText = ''; cover.innerHTML = '';
    title.textContent = 'Ничего не воспроизводится'; artist.textContent = '—';
    durTime.textContent = '0:00';
  }
  playBtn.innerHTML = state.isPlaying
    ? `<svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>`
    : `<svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
  shuffleBtn.classList.toggle('on', state.shuffle);
  repeatBtn.classList.toggle('on', state.repeat !== 'off');
  updateSleepButton();
}
function openFullPlayer() {
  if (window.innerWidth > 768) return;
  document.getElementById('fullPlayer').classList.add('open');
  syncFullPlayerUI();
}
function closeFullPlayer() {
  document.getElementById('fullPlayer').classList.remove('open');
}

document.querySelector('.player')?.addEventListener('click', e => {
  if (window.innerWidth > 768) return;
  if (e.target.closest('button')) return;
  if (e.target.closest('.p-progress')) return;
  openFullPlayer();
});
document.getElementById('fpClose')?.addEventListener('click', closeFullPlayer);
document.getElementById('fpPlayBtn')?.addEventListener('click', togglePlay);
document.getElementById('fpNextBtn')?.addEventListener('click', () => nextTrack(true));
document.getElementById('fpPrevBtn')?.addEventListener('click', prevTrack);
document.getElementById('fpShuffleBtn')?.addEventListener('click', () => { state.shuffle = !state.shuffle; updatePlayerUI(); });
document.getElementById('fpRepeatBtn')?.addEventListener('click', () => {
  state.repeat = state.repeat === 'off' ? 'all' : state.repeat === 'all' ? 'one' : 'off';
  updatePlayerUI();
});
document.getElementById('fpLyricsBtn')?.addEventListener('click', () => {
  document.getElementById('lyricsPanel').classList.add('open');
  document.getElementById('lyricsBtn').classList.add('on');
});
document.getElementById('fpSeekBar')?.addEventListener('pointerdown', e => {
  if (!audio.duration) return;
  const bar = e.currentTarget;
  const rect = bar.getBoundingClientRect();
  const apply = ev => {
    const x = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
    audio.currentTime = x * audio.duration;
    document.getElementById('fpSeekFill').style.width = (x * 100) + '%';
    document.getElementById('seekFill').style.width = (x * 100) + '%';
    document.getElementById('fpCurTime').textContent = fmt(audio.currentTime);
    document.getElementById('curTime').textContent = fmt(audio.currentTime);
  };
  apply(e);
  const onMove = ev => apply(ev);
  const onUp = () => {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
  };
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
});
document.getElementById('fpSleepBtn')?.addEventListener('click', e => {
  e.stopPropagation();
  document.getElementById('fpTimerMenu').classList.toggle('show');
});
document.getElementById('fpTimerMenu')?.addEventListener('click', e => {
  const btn = e.target.closest('button[data-min]');
  if (!btn) return;
  const v = btn.dataset.min;
  document.getElementById('fpTimerMenu').classList.remove('show');
  if (v === 'off') { clearSleepTimer(); toast('Таймер выключен'); return; }
  setSleepTimer(v === 'track' ? 'track' : +v);
});
document.addEventListener('click', e => {
  if (!e.target.closest('#fpSleepBtn') && !e.target.closest('#fpTimerMenu')) {
    document.getElementById('fpTimerMenu')?.classList.remove('show');
  }
});
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration * 100) + '%';
  const fill = document.getElementById('fpSeekFill');
  if (fill) fill.style.width = pct;
  const ct = document.getElementById('fpCurTime');
  if (ct) ct.textContent = fmt(audio.currentTime);
  const dt = document.getElementById('fpDurTime');
  if (dt) dt.textContent = fmt(audio.duration);
});
const _origNextTrack = nextTrack;
nextTrack = function (user = true) {
  if (sleepTimer && sleepTimer.type === 'track' && !user) {
    audio.pause();
    clearSleepTimer();
    toast('Таймер сна: воспроизведение остановлено');
    return;
  }
  return _origNextTrack(user);
};
const _origUpdatePlayerUI = updatePlayerUI;
updatePlayerUI = function () {
  _origUpdatePlayerUI.apply(this, arguments);
  syncFullPlayerUI();
};

/* =====================================================================
   ИНИЦИАЛИЗАЦИЯ
   ===================================================================== */
(async function init() {
  try { await openDB(); }
  catch (err) {
    console.error(err);
    alert('Не удалось открыть IndexedDB. Откройте страницу через http:// (локальный сервер), а не file://');
    return;
  }
  await reloadData();
  audio.volume = 1;
  navigate('home');
  updatePlayerUI();
  updateLyricsPanel();
})();
</script>
